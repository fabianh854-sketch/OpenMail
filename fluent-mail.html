   13. NACHRICHT VERFASSEN
   ========================================================================== */
let compose = null;
const SAVE_DELAY = 800;
const MAX_FILE_SIZE = 25 * 1048576;

const asRecipient = person => ({ name: person.name || '', email: person.email, valid: true });
const stripRecipient = r => ({ name: r.name, email: r.email });

function dedupe(list) {
  const seen = new Set();
  return list.filter(r => { const key = r.email.toLowerCase(); if (seen.has(key)) return false; seen.add(key); return true; });
}

function cloneAttachment(att) {
  const copy = { ...att, id: uid('a') };
  if (fileStore.has(att.id)) fileStore.set(copy.id, fileStore.get(att.id));
  return copy;
}

function signatureNode(text) {
  if (!text.trim()) return null;
  const p = h('p', {}, '-- ');
  for (const line of text.split(/\r?\n/)) p.append(h('br'), line);
  return p;
}

/** Empfänger, Betreff, Anhänge und Zitat für Antworten und Weiterleitungen. */
function replyContext(mode, mail) {
  if (mode === 'forward') {
    const header = h('p', {}, '---------- Weitergeleitete Nachricht ----------', h('br'),
      `Von: ${personLabel(mail.from)} <${mail.from.email}>`, h('br'),
      `Datum: ${fmtLong(mail.date)}`, h('br'),
      `Betreff: ${mail.subject}`, h('br'),
      `An: ${mail.to.map(personLabel).join(', ')}`);
    return { to: [], cc: [], subject: withPrefix(mail.subject, 'WG:', /^\s*(?:wg|fwd?):/i), attachments: mail.attachments.map(cloneAttachment), quote: h('div', {}, header, sanitizeHTML(mail.body)) };
  }
  const fromMe = isOwn(mail.from);
  let to = fromMe ? [...mail.to] : [mail.from];
  let cc = [];
  if (mode === 'replyAll') {
    to = fromMe ? [...mail.to] : [mail.from, ...mail.to];
    cc = [...mail.cc];
    to = to.filter(r => !isOwn(r));
    cc = cc.filter(r => !isOwn(r));
    if (!to.length) to = [mail.from];
  }
  const quote = h('div', {}, h('p', {}, `Am ${fmtLong(mail.date)} schrieb ${personLabel(mail.from)} <${mail.from.email}>:`), h('blockquote', {}, sanitizeHTML(mail.body)));
  return { to: dedupe(to).map(asRecipient), cc: dedupe(cc).map(asRecipient), subject: withPrefix(mail.subject, 'AW:', /^\s*(?:aw|re):/i), attachments: [], quote };
}

function parseAddresses(text) {
  const parts = text.split(/[;,]+/).flatMap(part => {
    const trimmed = part.trim();
    if (!trimmed) return [];
    if (!trimmed.includes('<') && /\s/.test(trimmed) && trimmed.split(/\s+/).every(p => p.includes('@'))) return trimmed.split(/\s+/);
    return [trimmed];
  });
  return parts.map(part => {
    const match = part.match(/^(.*?)\s*<([^<>]*)>$/);
    const email = (match ? match[2] : part).trim();
    const known = state.contacts.find(c => c.email.toLowerCase() === email.toLowerCase());
    return { name: (match ? match[1].replace(/^"|"$/g, '').trim() : '') || known?.name || '', email, valid: EMAIL_RE.test(email) };
  });
}

function openCompose({ mode = 'new', mail = null, text = '' } = {}) {
  if (compose) closeCompose({ save: true });
  const isDraft = mode === 'draft';
  const account = mail ? accountById(mail.account) : activeAccount();
  const context = mode === 'new' || isDraft ? null : replyContext(mode, mail);
  const c = {
    id: isDraft ? mail.id : uid('m'), account: account.id, to: [], cc: [], bcc: [], subject: '', attachments: [],
    timer: 0, opener: document.activeElement, savedSig: '', sending: false, fields: {},
  };
  let bodyHTML;
  if (isDraft) {
    c.to = mail.to.map(asRecipient);
    c.cc = mail.cc.map(asRecipient);
    c.bcc = mail.bcc.map(asRecipient);
    c.subject = mail.subject;
    c.attachments = mail.attachments.map(a => ({ ...a }));
    bodyHTML = mail.body;
  } else {
    if (context) Object.assign(c, { to: context.to, cc: context.cc, subject: context.subject, attachments: context.attachments });
    const box = document.createElement('div');
    box.append(...(text ? [...textToParagraphs(text).childNodes] : [h('p', {}, h('br'))]));
    const signature = signatureNode(account.signature);
    if (signature) box.append(signature);
    if (context) box.append(context.quote);
    bodyHTML = box.innerHTML;
  }
  compose = c;
  buildCompose(bodyHTML);
  c.savedSig = isDraft ? composeSignature() : '';
  if (!isDraft) c.initialSig = composeSignature();
  const focusTarget = mode === 'reply' || mode === 'replyAll' ? c.editor : c.fields.to.input;
  focusTarget.focus();
}

const composeSignature = () => {
  const c = compose;
  const emails = list => list.map(r => r.email);
  return JSON.stringify([c.account, emails(c.to), emails(c.cc), emails(c.bcc), c.subject, c.attachments.map(a => a.id), c.editor.innerHTML]);
};

const composeBlank = () => {
  const c = compose;
  return !c.to.length && !c.cc.length && !c.bcc.length && !c.subject.trim() && !c.attachments.length && !c.editor.textContent.trim();
};

function flushRecipients() {
  for (const field of Object.values(compose.fields)) field.flush();
}

function scheduleSave() {
  const c = compose;
  if (!c) return;
  clearTimeout(c.timer);
  c.status.textContent = 'Änderungen werden gespeichert …';
  c.timer = setTimeout(saveDraft, SAVE_DELAY);
}

/** Speichert den Entwurf; gibt true zurück, wenn ein Entwurf existiert. */
function saveDraft() {
  const c = compose;
  if (!c) return false;
  clearTimeout(c.timer);
  flushRecipients();
  const existing = findMail(c.id);
  if (composeBlank()) {
    if (existing) { state.mails = state.mails.filter(m => m.id !== c.id); persist(); render(); }
    c.status.textContent = '';
    return false;
  }
  const signature = composeSignature();
  if (signature === c.savedSig || signature === c.initialSig) { c.status.textContent = existing ? c.savedText || '' : ''; return Boolean(existing); }
  const sender = accountById(c.account);
  const data = {
    account: c.account, folder: 'drafts', from: { name: sender.name, email: sender.email },
    to: c.to.map(stripRecipient), cc: c.cc.map(stripRecipient), bcc: c.bcc.map(stripRecipient),
    subject: c.subject, body: sanitizeToString(c.editor.innerHTML), date: Date.now(), read: true,
    attachments: c.attachments.map(a => ({ id: a.id, name: a.name, size: a.size, type: a.type })),
  };
  if (existing) Object.assign(existing, data);
  else state.mails.push({ id: c.id, starred: false, labels: [], ...data });
  c.savedSig = signature;
  c.savedText = `Entwurf gespeichert um ${fmtClock(Date.now())}`;
  c.status.textContent = c.savedText;
  persist();
  render();
  return true;
}

function closeCompose({ save = true, announce = false } = {}) {
  const c = compose;
  if (!c) return;
  const saved = save ? saveDraft() : false;
  clearTimeout(c.timer);
  c.cleanup();
  compose = null;
  c.win.remove();
  if (c.opener?.isConnected) c.opener.focus({ preventScroll: true });
  if (announce && saved) toast('Entwurf gespeichert');
}

async function discardCompose() {
  const c = compose;
  if (!composeBlank()) {
    const ok = await askConfirm({ title: 'Nachricht verwerfen?', message: 'Der Entwurf wird endgültig gelöscht.', confirm: 'Verwerfen', danger: true });
    if (!ok || compose !== c) return;
  }
  if (findMail(c.id)) { state.mails = state.mails.filter(m => m.id !== c.id); persist(); }
  closeCompose({ save: false });
  render();
  toast('Entwurf verworfen');
}

async function sendCompose() {
  const c = compose;
  if (c.sending) return;
  flushRecipients();
  const all = [...c.to, ...c.cc, ...c.bcc];
  const invalid = all.find(r => !r.valid);
  if (invalid) { toast(`Ungültige E-Mail-Adresse: ${invalid.email}`); return; }
  if (!all.length) { toast('Bitte geben Sie mindestens einen Empfänger an.'); c.fields.to.input.focus(); return; }
  if (!c.subject.trim()) {
    const ok = await askConfirm({ title: 'Ohne Betreff senden?', message: 'Diese Nachricht hat keinen Betreff. Möchten Sie sie trotzdem senden?', confirm: 'Senden' });
    if (!ok || compose !== c) { c.subjectInput.focus(); return; }
  }
  c.sending = true;
  sendMail({ account: c.account, to: c.to, cc: c.cc, bcc: c.bcc, subject: c.subject.trim() || '(Kein Betreff)', body: c.editor.innerHTML, attachments: c.attachments });
  state.mails = state.mails.filter(m => m.id !== c.id);
  closeCompose({ save: false });
  persist();
  render();
  toast('Nachricht gesendet');
}

function addFiles(fileList) {
  const c = compose;
  for (const file of fileList) {
    if (file.size > MAX_FILE_SIZE) { toast(`„${file.name}“ ist größer als 25 MB und wurde nicht angehängt.`); continue; }
    const att = { id: uid('a'), name: file.name, size: file.size, type: fileKind(file.name) };
    fileStore.set(att.id, file);
    c.attachments.push(att);
  }
  renderComposeAttachments();
  scheduleSave();
}

function renderComposeAttachments() {
  const c = compose;
  c.attBox.replaceChildren(...c.attachments.map(att => h('span', { class: 'att-chip' },
    fileIcon(att.type),
    h('span', { class: 'att-name', title: att.name }, att.name),
    h('span', { class: 'att-size' }, fmtSize(att.size)),
    iconButton({
      label: `Anhang entfernen: ${att.name}`, iconName: 'close', cls: 'btn--sm',
      on: { click: () => { c.attachments = c.attachments.filter(a => a.id !== att.id); renderComposeAttachments(); scheduleSave(); } },
    }))));
}

/** Empfängerfeld mit Chips, Validierung und Autovervollständigung. */
function recipientField(key, labelText) {
  const c = compose;
  const inputId = `rcpt-${key}`;
  const input = h('input', {
    class: 'field-input', id: inputId, type: 'text', autocomplete: 'off', role: 'combobox',
    'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': `suggest-${key}`,
  });
  const main = h('div', { class: 'field-main' }, input);
  const suggest = h('div', { class: 'suggest', role: 'listbox', id: `suggest-${key}`, 'aria-label': `Vorschläge für ${labelText}`, hidden: true });
  const row = h('div', { class: 'field-row' }, h('label', { class: 'field-name', for: inputId }, labelText), main, suggest);
  let matches = [];
  let active = -1;
  let query = '';

  const changed = () => {
    renderChips();
    scheduleSave();
  };
  const renderChips = () => {
    for (const old of main.querySelectorAll('.rcpt-chip')) old.remove();
    for (const r of c[key]) {
      main.insertBefore(h('span', { class: `rcpt-chip${r.valid ? '' : ' is-invalid'}`, title: r.valid ? r.email : `${r.email} – ungültige E-Mail-Adresse` },
        h('span', { class: 'rcpt-text' }, r.valid ? (r.name || r.email) : `${r.email} (ungültig)`),
        iconButton({ label: `Entfernen: ${r.email}`, iconName: 'close', cls: 'btn--sm', on: { click: () => { c[key] = c[key].filter(x => x !== r); changed(); input.focus(); } } })), input);
    }
  };
  const renderSuggest = () => {
    suggest.hidden = !matches.length;
    input.setAttribute('aria-expanded', String(matches.length > 0));
    if (active >= 0) input.setAttribute('aria-activedescendant', `sug-${key}-${active}`);
    else input.removeAttribute('aria-activedescendant');
    suggest.replaceChildren(...matches.map((contact, i) => h('button', {
      class: 'suggest-item', type: 'button', role: 'option', id: `sug-${key}-${i}`, tabindex: '-1', 'aria-selected': String(i === active),
      on: { mousedown: e => { e.preventDefault(); pick(contact); } },
    }, avatar(contact, 'xs'),
    h('span', { class: 'suggest-text' }, h('span', {}, highlight(contact.name, [query])), h('span', { class: 'suggest-mail' }, highlight(contact.email, [query]))))));
  };
  const updateSuggest = () => {
    query = input.value.trim().toLowerCase();
    matches = query ? state.contacts.filter(ct => !c[key].some(r => r.email.toLowerCase() === ct.email.toLowerCase()) && `${ct.name} ${ct.email}`.toLowerCase().includes(query)).slice(0, 6) : [];
    active = matches.length ? 0 : -1;
    renderSuggest();
  };
  const commit = text => {
    const added = parseAddresses(text).filter(r => !c[key].some(x => x.email.toLowerCase() === r.email.toLowerCase()));
    c[key].push(...added);
    if (added.length) changed();
  };
  const pick = contact => {
    c[key].push(asRecipient(contact));
    input.value = '';
    updateSuggest();
    changed();
  };
  const flush = () => {
    if (!input.value.trim()) return;
    commit(input.value);
    input.value = '';
    updateSuggest();
  };

  input.addEventListener('input', () => {
    const separator = Math.max(input.value.lastIndexOf(','), input.value.lastIndexOf(';'));
    if (separator >= 0) { commit(input.value.slice(0, separator)); input.value = input.value.slice(separator + 1).trimStart(); }
    updateSuggest();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && matches.length) { active = (active + 1) % matches.length; renderSuggest(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && matches.length) { active = (active - 1 + matches.length) % matches.length; renderSuggest(); e.preventDefault(); }
    else if ((e.key === 'Enter' || e.key === 'Tab') && matches.length && active >= 0) { e.preventDefault(); pick(matches[active]); }
    else if (e.key === 'Enter') { e.preventDefault(); flush(); }
    else if (e.key === 'Backspace' && !input.value && c[key].length) { c[key].pop(); changed(); }
    else if (e.key === 'Escape' && matches.length) { matches = []; active = -1; renderSuggest(); e.stopPropagation(); }
  });
  input.addEventListener('blur', () => { flush(); matches = []; active = -1; renderSuggest(); });

  renderChips();
  c.fields[key] = { input, flush };
  return row;
}

const normalizeUrl = value => {
  const url = value.trim();
  if (/^[a-z][a-z0-9+.-]*:/i.test(url)) return url;
  return url.includes('@') && !url.includes('/') ? `mailto:${url}` : `https://${url}`;
};

function buildCompose(bodyHTML) {
  const c = compose;
  const account = accountById(c.account);
  const title = h('span', { class: 'compose-title', id: 'compose-title' }, c.subject || 'Neue Nachricht');
  const editor = h('div', { class: 'editor', contenteditable: 'true', role: 'textbox', 'aria-multiline': 'true', 'aria-label': 'Nachrichtentext', spellcheck: 'true' });
  editor.append(sanitizeHTML(bodyHTML));
  const status = h('span', { class: 'compose-status' });
  const attBox = h('div', { class: 'compose-atts', 'aria-label': 'Anhänge', role: 'group' });
  const fileInput = h('input', { type: 'file', multiple: true, hidden: true, on: { change: () => { addFiles(fileInput.files); fileInput.value = ''; } } });
  Object.assign(c, { editor, status, attBox, titleEl: title });

  /* Kopfzeilen */
  const toRow = recipientField('to', 'An');
  const ccRow = recipientField('cc', 'CC');
  const bccRow = recipientField('bcc', 'BCC');
  ccRow.hidden = !c.cc.length;
  bccRow.hidden = !c.bcc.length;
  const toggle = (labelText, row, field) => {
    const button = h('button', { class: 'btn btn--sm', type: 'button', style: 'width:auto;padding:0 6px', 'aria-expanded': String(!row.hidden), on: { click: () => { row.hidden = false; button.hidden = true; c.fields[field].input.focus(); } } }, labelText);
    button.hidden = !row.hidden;
    return button;
  };
  toRow.append(h('div', { class: 'field-toggles' }, toggle('CC', ccRow, 'cc'), toggle('BCC', bccRow, 'bcc')));

  const fromSelect = state.accounts.length > 1 ? h('div', { class: 'field-row' },
    h('label', { class: 'field-name', for: 'compose-from' }, 'Von'),
    h('div', { class: 'field-main' }, h('select', { class: 'input from-select', id: 'compose-from', on: { change: e => { c.account = e.target.value; scheduleSave(); } } },
      state.accounts.map(a => h('option', { value: a.id, selected: a.id === c.account }, `${a.name} <${a.email}> · ${a.label}`))))) : null;

  const subjectInput = h('input', { class: 'field-input', id: 'compose-subject', type: 'text', autocomplete: 'off', value: c.subject,
    on: { input: e => { c.subject = e.target.value; title.textContent = c.subject || 'Neue Nachricht'; scheduleSave(); } } });
  c.subjectInput = subjectInput;
  const subjectRow = h('div', { class: 'field-row' }, h('label', { class: 'field-name', for: 'compose-subject' }, 'Betreff'), h('div', { class: 'field-main' }, subjectInput));

  /* Editor-Werkzeugleiste */
  const formats = [
    ['bold', 'bold', 'Fett (Strg+B)'], ['italic', 'italic', 'Kursiv (Strg+I)'], ['underline', 'underline', 'Unterstrichen (Strg+U)'],
    ['insertUnorderedList', 'listBullet', 'Aufzählung'], ['insertOrderedList', 'listNumber', 'Nummerierung'], ['link', 'link', 'Link einfügen'], ['quote', 'quote', 'Zitat'],
  ];
  const toolButtons = formats.map(([command, iconName, label]) => h('button', {
    class: 'btn btn--icon', type: 'button', title: label, 'aria-label': label, 'aria-pressed': command === 'link' ? null : 'false', dataset: { command },
    on: { mousedown: e => e.preventDefault(), click: () => runFormat(command) },
  }, icon(iconName)));
  const toolbar = h('div', { class: 'editor-toolbar', role: 'toolbar', 'aria-label': 'Textformatierung' }, toolButtons);

  const inQuote = () => {
    const sel = window.getSelection();
    let node = sel.rangeCount ? sel.anchorNode : null;
    while (node && node !== editor) { if (node.nodeName === 'BLOCKQUOTE') return true; node = node.parentNode; }
    return false;
  };
  const updateToolbar = () => {
    if (!editor.contains(window.getSelection().anchorNode)) return;
    for (const button of toolButtons) {
      const { command } = button.dataset;
      if (command === 'link') continue;
      const on = command === 'quote' ? inQuote() : document.queryCommandState(command);
      button.setAttribute('aria-pressed', String(on));
    }
  };
  const onSelectionChange = () => updateToolbar();
  document.addEventListener('selectionchange', onSelectionChange);
  c.cleanup = () => document.removeEventListener('selectionchange', onSelectionChange);

  async function runFormat(command) {
    editor.focus();
    if (command === 'link') { await insertLink(); return; }
    if (command === 'quote') document.execCommand(inQuote() ? 'outdent' : 'formatBlock', false, inQuote() ? undefined : 'blockquote');
    else document.execCommand(command);
    updateToolbar();
    scheduleSave();
  }

  async function insertLink() {
    const sel = window.getSelection();
    const range = sel.rangeCount && editor.contains(sel.anchorNode) ? sel.getRangeAt(0).cloneRange() : null;
    const url = await askText({
      title: 'Link einfügen', label: 'Adresse (URL oder E-Mail)', value: 'https://', confirm: 'Einfügen',
      validate: value => (safeHref(normalizeUrl(value)) && value.trim() !== 'https://' ? '' : 'Bitte eine gültige Web- oder E-Mail-Adresse eingeben.'),
    });
    if (!url) return;
    editor.focus();
    if (range) { sel.removeAllRanges(); sel.addRange(range); }
    const href = safeHref(normalizeUrl(url));
    if (range && !range.collapsed) document.execCommand('createLink', false, href);
    else document.execCommand('insertHTML', false, h('a', { href }, href).outerHTML);
    scheduleSave();
  }

  editor.addEventListener('input', scheduleSave);
  editor.addEventListener('paste', e => {
    e.preventDefault();
    const html = e.clipboardData.getData('text/html');
    if (html) document.execCommand('insertHTML', false, sanitizeToString(html));
    else document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
  });

  /* Fenster */
  const minimizeBtn = h('button', { class: 'btn btn--icon btn--sm', type: 'button', title: 'Minimieren', 'aria-label': 'Minimieren', 'aria-expanded': 'true' }, icon('minimize'));
  const maximizeBtn = h('button', { class: 'btn btn--icon btn--sm', type: 'button', title: 'Maximieren', 'aria-label': 'Maximieren' }, icon('maximize'));
  const closeBtn = h('button', { class: 'btn btn--icon btn--sm', type: 'button', title: 'Schließen (Entwurf wird gespeichert)', 'aria-label': 'Schließen (Entwurf wird gespeichert)' }, icon('close'));
  const win = h('section', { class: 'compose', role: 'dialog', 'aria-labelledby': 'compose-title', 'aria-modal': 'false', 'data-drop-text': 'Dateien hier ablegen, um sie anzuhängen' },
    h('header', { class: 'compose-head' }, title, minimizeBtn, maximizeBtn, closeBtn),
    h('div', { class: 'compose-body' }, fromSelect, toRow, ccRow, bccRow, subjectRow, toolbar, editor, attBox),
    h('footer', { class: 'compose-foot' },
      h('button', { class: 'btn btn--accent', type: 'button', title: 'Senden (Strg+Enter)', on: { click: sendCompose } }, icon('send'), 'Senden'),
      iconButton({ label: 'Datei anhängen', iconName: 'paperclip', on: { click: () => fileInput.click() } }),
      iconButton({ label: 'Verwerfen', iconName: 'trash', on: { click: discardCompose } }),
      iconButton({ label: 'Sendeoptionen (Verschlüsselung, Bestätigung, Priorität)', iconName: 'shield', on: { click: e => openComposeOptions(e.currentTarget) } }),
      (c.optsBox = h('span', { class: 'compose-opts' })),
      status),
    fileInput);
  c.win = win;

  const setMinimized = value => {
    win.classList.toggle('is-min', value);
    minimizeBtn.setAttribute('aria-expanded', String(!value));
    minimizeBtn.replaceChildren(icon(value ? 'maximize' : 'minimize'));
    minimizeBtn.title = value ? 'Wiederherstellen' : 'Minimieren';
    minimizeBtn.setAttribute('aria-label', minimizeBtn.title);
  };
  minimizeBtn.addEventListener('click', () => setMinimized(!win.classList.contains('is-min')));
  title.addEventListener('click', () => { if (win.classList.contains('is-min')) setMinimized(false); });
  maximizeBtn.addEventListener('click', () => {
    const on = win.classList.toggle('is-max');
    setMinimized(false);
    maximizeBtn.replaceChildren(icon(on ? 'restore' : 'maximize'));
    maximizeBtn.title = on ? 'Verkleinern' : 'Maximieren';
    maximizeBtn.setAttribute('aria-label', maximizeBtn.title);
  });
  closeBtn.addEventListener('click', () => closeCompose({ save: true, announce: true }));
  win.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendCompose(); } });

  /* Drag & Drop von Dateien */
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  win.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); win.classList.add('is-drop'); } });
  win.addEventListener('dragleave', e => { if (!win.contains(e.relatedTarget)) win.classList.remove('is-drop'); });
  win.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    win.classList.remove('is-drop');
    addFiles(e.dataTransfer.files);
  });

  renderComposeAttachments();
  composeHost.append(win);
}

/* ==========================================================================
   14. AKTIONEN
   ========================================================================== */
const msgCount = (n, verb) => (n === 1 ? `Nachricht ${verb}` : `${n} Nachrichten ${verb}`);

function restoreSnapshot(snapshot) {
  for (const saved of snapshot) {
    const index = state.mails.findIndex(m => m.id === saved.id);
    if (index >= 0) state.mails[index] = saved;
    else state.mails.push(saved);
  }
  persist();
  render();
}

/** Markiert eine Konversation als geöffnet und als gelesen. Rendert nicht selbst. */
function activate(id) {
  const mail = findMail(id);
  if (!mail) return;
  const members = threadMembers(mail);
  ui.selectedId = id;
  ui.cursorId = id;
  ui.expanded = new Set([id, members[members.length - 1].id, ...members.filter(m => !m.read).map(m => m.id)]);
  let marked = false;
  for (const m of members) if (!m.read) { m.read = true; marked = true; }
  if (marked) persist();
}

function neighborConvId(idSet) {
  const list = derived.convs;
  const index = list.findIndex(c => c.mails.some(m => m.id === ui.selectedId));
  if (index < 0) return null;
  const survives = conv => !conv.mails.every(m => idSet.has(m.id));
  for (let i = index + 1; i < list.length; i += 1) if (survives(list[i])) return list[i].rep.id;
  for (let i = index - 1; i >= 0; i -= 1) if (survives(list[i])) return list[i].rep.id;
  return null;
}

/** Wendet eine Änderung an, korrigiert die Auswahl und bietet optional „Rückgängig“ an. */
function change(ids, mutate, { message, remove = false, reselect = false } = {}) {
  const idSet = new Set(ids);
  const targets = state.mails.filter(m => idSet.has(m.id));
  if (!targets.length) return;
  const snapshot = targets.map(m => structuredClone(m));
  const neighbor = reselect ? neighborConvId(idSet) : null;
  if (remove) state.mails = state.mails.filter(m => !idSet.has(m.id));
  else mutate(targets);
  refresh();
  for (const repId of [...ui.checked]) if (!derived.convs.some(c => c.rep.id === repId)) ui.checked.delete(repId);
  if (reselect && ui.selectedId && !derived.convs.some(c => c.mails.some(m => m.id === ui.selectedId))) {
    ui.selectedId = null;
    if (neighbor && !isOverlay()) activate(neighbor);
  }
  if (ui.cursorId && !derived.convs.some(c => c.rep.id === ui.cursorId)) ui.cursorId = ui.selectedId;
  persist();
  render();
  if (message) toast(message, { actionLabel: 'Rückgängig', onAction: () => restoreSnapshot(snapshot) });
}

function moveVerb(folder) {
  if (folder === 'archive') return 'archiviert';
  if (folder === 'trash') return 'gelöscht';
  if (folder === 'spam') return 'als Spam gemeldet';
  return `nach „${folderName(folder)}“ verschoben`;
}

function moveMails(ids, folder) {
  const movable = ids.filter(id => findMail(id) && findMail(id).folder !== folder);
  if (!movable.length) return;
  if (compose && movable.includes(compose.id)) closeCompose({ save: false });
  change(movable, mails => mails.forEach(m => { m.folder = folder; }), { reselect: true, message: msgCount(movable.length, moveVerb(folder)) });
}

const archiveMails = ids => moveMails(ids, 'archive');

function deleteMails(ids) {
  const mails = ids.map(findMail).filter(Boolean);
  if (!mails.length) return;
  if (mails.every(m => m.folder === 'trash')) {
    change(ids, null, { remove: true, reselect: true, message: msgCount(ids.length, 'endgültig gelöscht') });
    return;
  }
  moveMails(ids, 'trash');
}

function toggleStar(ids) {
  change(ids, mails => { const value = !mails.every(m => m.starred); mails.forEach(m => { m.starred = value; }); });
}

function toggleRead(ids) {
  change(ids, mails => { const value = mails.some(m => !m.read); mails.forEach(m => { m.read = value; }); });
}

function setLabel(ids, labelId, on) {
  change(ids, mails => mails.forEach(m => { m.labels = m.labels.filter(l => l !== labelId); if (on) m.labels.push(labelId); }));
}

function toggleLabel(ids, labelId) {
  const mails = ids.map(findMail).filter(Boolean);
  setLabel(ids, labelId, !mails.every(m => m.labels.includes(labelId)));
}

function toggleChecked(repId) {
  if (ui.checked.has(repId)) ui.checked.delete(repId);
  else ui.checked.add(repId);
  render();
}

/* ---- Ziele für Aktionen ---- */
function targetIds() {
  if (ui.checked.size) return [...ui.checked].flatMap(idsOfConv);
  const id = ui.selectedId ?? ui.cursorId;
  return id ? idsOfConv(id) : [];
}

const mailOfConv = id => convOfMail(id)?.rep ?? findMail(id) ?? null;
const targetMail = () => { const id = ui.selectedId ?? ui.cursorId; return id ? mailOfConv(id) : null; };

/* ---- Navigation ---- */
function resetSelection() {
  ui.selectedId = null;
  ui.cursorId = null;
  ui.checked.clear();
  ui.drawerOpen = false;
}

function setFolder(view) {
  state.view.folder = view;
  resetSelection();
  persist();
  render();
}

function switchAccount(id) {
  state.activeAccount = id;
  if (!viewExists(state.view.folder)) state.view.folder = 'inbox';
  resetSelection();
  persist();
  render();
}

function openConv(id) {
  const mail = findMail(id);
  if (!mail) return;
  if (mail.folder === 'drafts') {
    ui.cursorId = id;
    openCompose({ mode: 'draft', mail });
    render();
    return;
  }
  activate(id);
  if (isOverlay()) ui.focusAfterRender = 'reader';
  render();
}

function closeReader() {
  const repId = ui.selectedId ? convOfMail(ui.selectedId)?.rep.id : null;
  ui.selectedId = null;
  if (repId && isOverlay()) ui.focusAfterRender = `row:${repId}`;
  render();
}

function moveSelection(offset) {
  const list = derived.convs;
  if (!list.length) return;
  const known = ui.selectedId ?? ui.cursorId;
  const current = known ? list.findIndex(c => c.mails.some(m => m.id === known)) : -1;
  const next = current < 0 ? 0 : Math.min(list.length - 1, Math.max(0, current + offset));
  const { rep } = list[next];
  if (rep.folder === 'drafts' || (isOverlay() && !ui.selectedId)) ui.cursorId = rep.id;
  else activate(rep.id);
  ui.focusAfterRender = `row:${rep.id}`;
  render();
}

function replyTo(mode, mail) {
  if (mail) openCompose({ mode, mail });
}

function downloadAttachment(mailId, attId) {
  const att = findMail(mailId)?.attachments.find(a => a.id === attId);
  if (!att) return;
  const file = fileStore.get(att.id);
  const blob = file ?? new Blob([`Demo-Anhang: ${att.name}\nGröße: ${fmtSize(att.size)}\n\nIn dieser Demo wird der ursprüngliche Dateiinhalt nicht gespeichert.\n`], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = h('a', { href: url, download: file ? att.name : `${att.name}.txt` });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(file ? `„${att.name}“ wird heruntergeladen.` : `Demo-Anhang „${att.name}“ wurde als Textdatei heruntergeladen.`);
}

/* ---- Senden & Zustellen ---- */
function notifyIncoming(mail) {
  if (!state.settings.notifications) return;
  const title = `Neue Nachricht von ${personLabel(mail.from)}`;
  setTimeout(() => {
    if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body: mail.subject });
    else toast(`${title}: ${mail.subject}`);
  }, 700);
}

/** Legt die gesendete Nachricht ab und stellt sie an eigene Konten zu (Demo). */
function sendMail({ account: accountId, to, cc = [], bcc = [], subject, body, attachments = [] }) {
  const sender = accountById(accountId);
  const cleanBody = sanitizeToString(body);
  const now = Date.now();
  const from = { name: sender.name, email: sender.email };
  state.mails.push({
    id: uid('m'), account: accountId, folder: 'sent', from, to: to.map(stripRecipient), cc: cc.map(stripRecipient), bcc: bcc.map(stripRecipient),
    subject, body: cleanBody, date: now, read: true, starred: false, labels: [], attachments,
  });
  const recipients = [...to, ...cc, ...bcc];
  for (const r of recipients) {
    if (!state.contacts.some(ct => ct.email.toLowerCase() === r.email.toLowerCase())) state.contacts.push({ name: r.name || r.email.split('@')[0], email: r.email });
  }
  const delivered = new Set();
  for (const r of recipients) {
    const target = state.accounts.find(a => a.email.toLowerCase() === r.email.toLowerCase());
    if (!target || delivered.has(target.id)) continue;
    delivered.add(target.id);
    const incoming = {
      id: uid('m'), account: target.id, folder: 'inbox', from, to: to.map(stripRecipient), cc: cc.map(stripRecipient), bcc: [],
      subject, body: cleanBody, date: now, read: false, starred: false, labels: [], attachments: attachments.map(cloneAttachment),
    };
    state.mails.push(incoming);
    notifyIncoming(incoming);
    if (target.ooo.enabled) {
      state.mails.push({
        id: uid('m'), account: accountId, folder: 'inbox', from: { name: target.name, email: target.email }, to: [from], cc: [], bcc: [],
        subject: `${target.ooo.subject}: ${subject}`, body: textToParagraphs(target.ooo.message).innerHTML, date: now + 1000,
        read: false, starred: false, labels: [], attachments: [],
      });
    }
  }
}

function sendQuickReply(id) {
  const mail = findMail(id);
  const text = (ui.quick.get(id) || '').trim();
  if (!mail) return;
  if (!text) { toast('Bitte geben Sie zuerst eine Antwort ein.'); return; }
  const context = replyContext('reply', mail);
  const account = accountById(mail.account);
  const box = document.createElement('div');
  box.append(textToParagraphs(text));
  const signature = signatureNode(account.signature);
  if (signature) box.append(signature);
  box.append(context.quote);
  sendMail({ account: account.id, to: context.to, cc: context.cc, subject: context.subject, body: box.innerHTML });
  ui.quick.delete(id);
  persist();
  render();
  toast('Antwort gesendet');
}

async function createFolder() {

  if (!name) return;
  const folder = { id: uid('f'), account: state.activeAccount, name };

}

async function renameFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  const name = await askText({ title: 'Ordner umbenennen', label: 'Neuer Name', value: folder.name, confirm: 'Umbenennen', validate: value => validateFolderName(value, folder.name) });
  if (!name) return;
  folder.name = name;
  persist();
  render();
}

async function deleteFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  const count = state.mails.filter(m => m.folder === id).length;
  const hits = state.filters.filter(f => f.actions.some(a => a.type === 'move' && a.value === id));
  const filterNote = hits.length ? ` ${hits.length} Filter ${plural(hits.length, 'verschiebt', 'verschieben')} künftig ins Archiv.` : '';
  const ok = await askConfirm({
    title: `Ordner „${folder.name}“ löschen?`,
    message: (count ? `${count} ${plural(count, 'Nachricht wird', 'Nachrichten werden')} in den Papierkorb verschoben.` : 'Der leere Ordner wird entfernt.') + filterNote,
    confirm: 'Löschen', danger: true,
  });
  if (!ok) return;
  for (const f of hits) {
    for (const a of f.actions) if (a.type === 'move' && a.value === id) a.value = 'archive';
    commit('save_filter', { filter: f });
  }
  for (const m of state.mails) if (m.folder === id) m.folder = 'trash';
  state.folders = state.folders.filter(f => f.id !== id);
  if (state.view.folder === id) { state.view.folder = 'inbox'; resetSelection(); }
  persist();
  render();
  toast(`Ordner „${folder.name}“ gelöscht${filterNote}`);
}

async function createLabel(applyTo = []) {
  const result = await askLabel({ title: 'Neue Kategorie', confirm: 'Erstellen' });
  if (!result) return;
  const label = { id: uid('l'), name: result.name, color: result.color };
  state.labels.push(label);
  if (applyTo.length) setLabel(applyTo, label.id, true);
  else { persist(); render(); }
  toast(`Kategorie „${label.name}“ erstellt`);
}

async function editLabel(id) {
  const label = labelById(id);
  const result = await askLabel({ title: 'Kategorie bearbeiten', name: label.name, color: label.color, confirm: 'Speichern' });
  if (!result) return;
  Object.assign(label, result);
  persist();
  render();
}

async function deleteLabel(id) {
  const label = labelById(id);
  const hits = state.filters.filter(f => f.actions.some(a => a.type === 'label' && a.value === id));
  const dropped = hits.filter(f => f.actions.every(a => a.type === 'label' && a.value === id));
  const changed = hits.length - dropped.length;
  const filterNote = [
    dropped.length ? `${dropped.length} ${plural(dropped.length, 'Filter wird', 'Filter werden')} gelöscht, weil ${plural(dropped.length, 'er', 'sie')} nur diese Kategorie setzen` : '',
    changed ? `${changed} ${plural(changed, 'Filter verliert', 'Filter verlieren')} die Aktion „Kategorie“` : '',
  ].filter(Boolean).map(t => ` ${t}.`).join('');
  const ok = await askConfirm({ title: `Kategorie „${label.name}“ löschen?`, message: `Die Kategorie wird von allen Nachrichten entfernt. Die Nachrichten selbst bleiben erhalten.${filterNote}`, confirm: 'Löschen', danger: true });
  if (!ok) return;
  for (const f of hits) {
    f.actions = f.actions.filter(a => !(a.type === 'label' && a.value === id));
    if (f.actions.length) commit('save_filter', { filter: f });
    else { state.filters = state.filters.filter(x => x !== f); commit('delete_filter', { id: f.id }); }
  }
  for (const m of state.mails) m.labels = m.labels.filter(l => l !== id);
  state.labels = state.labels.filter(l => l.id !== id);
  if (state.view.folder === `label:${id}`) { state.view.folder = 'inbox'; resetSelection(); }
  persist();
  render();
  toast(`Kategorie „${label.name}“ gelöscht${filterNote}`);
}

async function emptyTrash() {
  const trashed = state.mails.filter(m => m.account === state.activeAccount && m.folder === 'trash');
  if (!trashed.length) { toast('Der Papierkorb ist bereits leer.'); return; }
  const ok = await askConfirm({
    title: 'Papierkorb leeren?',
    message: `${trashed.length} ${plural(trashed.length, 'Nachricht wird', 'Nachrichten werden')} endgültig gelöscht. Das kann nicht rückgängig gemacht werden.`,
    confirm: 'Endgültig löschen', danger: true,
  });
  if (!ok) return;
  const ids = new Set(trashed.map(m => m.id));
  state.mails = state.mails.filter(m => !ids.has(m.id));
  if (ui.selectedId && ids.has(ui.selectedId)) ui.selectedId = null;
  ui.checked.clear();
  persist();
  render();
  toast('Papierkorb geleert');
}

function makeSwitch(labelId, checked, onChange) {

    class: 'switch', type: 'button', role: 'switch', 'aria-checked': String(checked), 'aria-labelledby': labelId,
    on: { click: () => { const value = button.getAttribute('aria-checked') !== 'true'; button.setAttribute('aria-checked', String(value)); onChange(value); } },
  }, h('span', { class: 'switch-thumb' }));
  return button;
}

function makeSegmented(label, options, current, onPick) {
  const group = h('div', { class: 'seg', role: 'radiogroup', 'aria-label': label });
  for (const [value, text] of options) {
    group.append(h('button', {
      class: 'seg-btn', type: 'button', role: 'radio', 'aria-checked': String(value === current),
      on: { click: e => { for (const sibling of group.children) sibling.setAttribute('aria-checked', String(sibling === e.currentTarget)); onPick(value); } },
    }, text));
  }
  return group;
}

const isTypingTarget = el => Boolean(el.closest?.('input, textarea, select, [contenteditable=""], [contenteditable="true"]'));

function handleEscape(e) {
  if (menuState) { closeMenu(); return true; }
  if (dialogs.length) { dialogs[dialogs.length - 1].close(); return true; }
  if (e.target.closest?.('#compose-host')) return false;
  if (e.target === $('#search')) {
    if (ui.query) { ui.query = ''; render(); } else e.target.blur();
    return true;
  }
  if (ui.drawerOpen) { ui.drawerOpen = false; render(); return true; }
  if (state.view.space !== 'mail' && ui.spaceOpen) { ui.spaceOpen = false; render(); return true; }
  if (ui.checked.size) { ui.checked.clear(); render(); return true; }
  if (ui.advOpen) { ui.advOpen = false; render(); return true; }
  if (ui.selectedId) { closeReader(); return true; }
  return false;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (handleEscape(e)) e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || menuState || dialogs.length) return;
  if (e.target.closest?.('#layer, #compose-host') || isTypingTarget(e.target)) return;
  if (state.view.space !== 'mail') return;

  const onRow = e.target.classList?.contains('mail-item');
  const ids = targetIds();
  const mail = targetMail();
  switch (e.key) {
    case '?': e.preventDefault(); showShortcuts(); return;
    case '/': e.preventDefault(); $('#search').focus(); return;
    case 'Delete': if (ids.length) { e.preventDefault(); deleteMails(ids); } return;
    case 'ArrowDown': e.preventDefault(); moveSelection(1); return;
    case 'ArrowUp': e.preventDefault(); moveSelection(-1); return;
    case 'Enter': if (onRow) { e.preventDefault(); openConv(e.target.dataset.id); } return;
    case ' ': if (onRow) { e.preventDefault(); toggleChecked(e.target.dataset.id); } return;
    default:
  }
  switch (e.key.toLowerCase()) {
    case 'c': e.preventDefault(); openCompose(); break;
    case 'r': if (mail) { e.preventDefault(); replyTo('reply', mail); } break;
    case 'a': if (mail) { e.preventDefault(); replyTo('replyAll', mail); } break;
    case 'f': if (mail) { e.preventDefault(); replyTo('forward', mail); } break;
    case 'e': if (ids.length) { e.preventDefault(); archiveMails(ids); } break;
    case 's': if (ids.length) { e.preventDefault(); toggleStar(ids); } break;
    case 'u': if (ids.length) { e.preventDefault(); toggleRead(ids); } break;
    default:
  }
});

/* ---- Wischgesten (Touch) ---- */
let swipe = null;
const listEl = $('#message-list');
listEl.addEventListener('pointerdown', e => {
  const item = e.pointerType === 'mouse' ? null : e.target.closest('.mail-item');
  if (item) swipe = { item, row: item.parentElement, id: item.dataset.id, x: e.clientX, y: e.clientY, dx: 0, active: false };
});
listEl.addEventListener('pointermove', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x;
  const dy = e.clientY - swipe.y;
  if (!swipe.active) {
    if (Math.abs(dy) > 12) { swipe = null; return; }
    if (Math.abs(dx) <= 12) return;
    swipe.active = true;
    swipe.item.setPointerCapture(e.pointerId);
    swipe.item.style.transition = 'none';
  }
  swipe.dx = dx;
  swipe.item.style.transform = `translateX(${dx}px)`;
  swipe.row.dataset.swipe = dx > 0 ? 'right' : 'left';
});
const endSwipe = () => {
  if (!swipe) return;
  const { item, row, id, dx, active } = swipe;
  swipe = null;
  if (!active) return;
  item.style.transition = '';
  item.style.transform = '';
  delete row.dataset.swipe;
  ui.swiped = true;
  setTimeout(() => { ui.swiped = false; }, 350);
  if (dx > 90) archiveMails(idsOfConv(id));
  else if (dx < -90) deleteMails(idsOfConv(id));
};
listEl.addEventListener('pointerup', endSwipe);
listEl.addEventListener('pointercancel', endSwipe);

/* ---- Größe der Liste ändern ---- */
const resizer = $('#resizer');
const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));

function resizeList(position) {
  const rect = $('#content').getBoundingClientRect();
  if (state.settings.pane === 'bottom') state.settings.listHeight = Math.round(clamp(position - rect.top - 8, 180, rect.height - 260));
  else state.settings.listWidth = Math.round(clamp(position - rect.left - 8, 280, Math.min(640, rect.width - 380)));
  renderChrome();
}

resizer.addEventListener('pointerdown', e => { resizer.setPointerCapture(e.pointerId); resizer.classList.add('is-dragging'); });
resizer.addEventListener('pointermove', e => {
  if (resizer.hasPointerCapture(e.pointerId)) resizeList(state.settings.pane === 'bottom' ? e.clientY : e.clientX);
});
const endResize = () => { resizer.classList.remove('is-dragging'); persist(); };
resizer.addEventListener('pointerup', endResize);
resizer.addEventListener('pointercancel', endResize);
resizer.addEventListener('keydown', e => {
  const bottom = state.settings.pane === 'bottom';
  const step = (bottom ? { ArrowUp: -16, ArrowDown: 16 } : { ArrowLeft: -16, ArrowRight: 16 })[e.key];
  if (!step) return;
  e.preventDefault();
  const rect = $('#content').getBoundingClientRect();
  resizeList((bottom ? rect.top + state.settings.listHeight : rect.left + state.settings.listWidth) + 8 + step);
  persist();
});

});

/** Allgemeiner Formular-Dialog: liefert die Werte, `{ __delete: true }` oder null. */
function formDialog({ title, fields, confirm = 'Speichern', deleteLabel, validate, variant = '' }) {
  const refs = {};
  const error = h('p', { class: 'field-error form-wide', role: 'alert' });
  const collect = () => Object.fromEntries(Object.entries(refs).map(([key, el]) => [key, el.type === 'checkbox' ? el.checked : el.value.trim()]));
  return showDialog({
    title, variant,
    content: () => h('div', { class: 'form-grid' },
      fields.map(f => {
        if (f.heading) return h('h3', { class: 'set-title form-wide' }, f.heading);
        const id = uid('f');
        let control;
        if (f.type === 'select') control = h('select', { class: 'input', id }, f.options.map(([value, text]) => h('option', { value, selected: String(value) === String(f.value) }, text)));
        else if (f.type === 'textarea') control = h('textarea', { class: 'input', id, rows: String(f.rows || 3), value: f.value ?? '' });
        else if (f.type === 'checkbox') {
          control = h('input', { id, type: 'checkbox' });
          control.checked = Boolean(f.value);
          refs[f.key] = control;
          return h('label', { class: 'check-line form-wide' }, control, f.label);
        } else control = h('input', { class: 'input', id, type: f.type || 'text', value: f.value ?? '', placeholder: f.placeholder, autocomplete: 'off' });
        refs[f.key] = control;
        return h('div', { class: f.wide ? 'form-wide' : '' }, h('label', { class: 'field-label', for: id }, f.label), control, f.hint ? h('p', { class: 'set-hint' }, f.hint) : null);
      }), error),
    buttons: [
      ...(deleteLabel ? [{ label: deleteLabel, kind: 'danger', value: { __delete: true } }] : []),
      { label: 'Abbrechen', value: null },
      {
        label: confirm, kind: 'accent', value: collect,
        onClick: () => {
          const missing = fields.find(f => f.required && !refs[f.key].value.trim());
          if (missing) { error.textContent = `Bitte „${missing.label}“ ausfüllen.`; refs[missing.key].focus(); return false; }
          const problem = validate?.(collect()) || '';
          error.textContent = problem;
          return problem ? false : undefined;
        },
      },
    ],
  });
}

function bookTitle(book) {
  if (book === 'all') return 'Alle Kontakte';
  if (book === 'fav') return 'Favoriten';
  if (book.startsWith('list:')) return listById(book.slice(5))?.name ?? 'Mailingliste';
  return state.books.find(b => b.id === book)?.name ?? 'Adressbuch';
}

function peopleIn(book, query) {
  let list = state.people;
  if (book === 'fav') list = list.filter(p => p.fav);
  else if (book.startsWith('list:')) { const l = listById(book.slice(5)); list = list.filter(p => l?.members.includes(p.id)); }
  else if (book !== 'all') list = list.filter(p => p.book === book);
  const q = query.trim().toLowerCase();
  if (q) list = list.filter(p => `${p.name} ${p.email} ${p.org} ${p.phone}`.toLowerCase().includes(q));
  return [...list].sort((a, b) => a.name.localeCompare(b.name, 'de'));
}

async function editPerson(person) {
  const isNew = !person;
  const book = sp.contacts.book;
  const result = await formDialog({
    title: isNew ? 'Neuer Kontakt' : 'Kontakt bearbeiten', deleteLabel: isNew ? null : 'Löschen',
    fields: [
      { key: 'name', label: 'Name', required: true, wide: true, value: person?.name },
      { key: 'email', label: 'E-Mail', type: 'email', value: person?.email },
      { key: 'phone', label: 'Telefon', type: 'tel', value: person?.phone },
      { key: 'org', label: 'Organisation', value: person?.org },
      { key: 'title', label: 'Position', value: person?.title },
      { key: 'book', label: 'Adressbuch', type: 'select', options: state.books.map(b => [b.id, b.name]), value: person?.book ?? (state.books.some(b => b.id === book) ? book : 'personal') },
      { key: 'note', label: 'Notiz', type: 'textarea', wide: true, value: person?.note },
    ],
    validate: v => (v.email && !EMAIL_RE.test(v.email) ? 'Bitte eine gültige E-Mail-Adresse eingeben.' : ''),
  });
  if (!result) return;
  if (result.__delete) {
    const ok = await askConfirm({ title: `Kontakt „${person.name}“ löschen?`, message: 'Der Kontakt wird auch aus allen Mailinglisten entfernt.', confirm: 'Löschen', danger: true });
    if (!ok) return;
    state.people = state.people.filter(p => p !== person);
    for (const l of state.lists) l.members = l.members.filter(id => id !== person.id);
    if (sp.contacts.sel === person.id) sp.contacts.sel = null;
    ui.spaceOpen = false;
    syncContacts();
    commit('delete_contact', { id: person.id });
    toast('Kontakt gelöscht');
  } else {
    let saved = person;
    if (isNew) { saved = { id: uid('p'), fav: false, ...result }; state.people.push(saved); sp.contacts.sel = saved.id; ui.spaceOpen = true; toast('Kontakt gespeichert'); }
    else { Object.assign(person, result); toast('Kontakt aktualisiert'); }
    syncContacts();
    commit('save_contact', { contact: saved });
  }
  render();
}

const calById = id => state.calendars.find(c => c.id === id);

function nextOccurrence(ts, repeat) {
  const d = new Date(ts);
  if (repeat === 'daily') d.setDate(d.getDate() + 1);
  else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
  else if (repeat === 'monthly') d.setMonth(d.getMonth() + 1);
  else d.setFullYear(d.getFullYear() + 1);
  return d.getTime();
}

/** Alle sichtbaren Termine im Zeitraum [from, to), inklusive Wiederholungen. */
function occurrences(from, to) {
  const out = [];
  for (const ev of state.events) {
    const cal = calById(ev.cal);
    if (!cal || !cal.on) continue;
    const span = (ev.allDay ? ev.end + DAY : ev.end) - ev.start;
    let start = ev.start;
    for (let guard = 0; start < to && guard < 1500; guard++) {
      if (start + span > from) out.push({ ev, cal, start, end: start + span });
      if (ev.repeat === 'none') break;
      start = nextOccurrence(start, ev.repeat);
    }
  }
  return out.sort((a, b) => a.start - b.start || b.end - a.end);
}

function layoutDay(segs) {
  const placed = [];
  let cluster = [];
  let clusterEnd = 0;
  const flush = () => {
    const lanes = [];
    for (const s of cluster) {
      let i = lanes.findIndex(end => end <= s.start);
      if (i < 0) { i = lanes.length; lanes.push(0); }
      lanes[i] = s.end;
      s.lane = i;
    }
    for (const s of cluster) s.lanes = lanes.length;
    placed.push(...cluster);
    cluster = [];
  };
  for (const s of segs) {
    if (cluster.length && s.start >= clusterEnd) { flush(); clusterEnd = 0; }
    cluster.push(s);
    clusterEnd = Math.max(clusterEnd, s.end);
  }
  if (cluster.length) flush();
  return placed;
}

async function editEvent(ev, preset = {}) {
  const isNew = !ev;
  const now = new Date();
  now.setMinutes(0, 0, 0);
  const startDefault = preset.start ?? now.getTime() + 36e5;
  const base = ev ?? { title: '', cal: state.calendars.find(c => c.on)?.id ?? state.calendars[0].id, place: '', allDay: false, start: startDefault, end: startDefault + 36e5, repeat: 'none', remind: 15, attendees: preset.attendees ?? '', desc: '' };
  const result = await formDialog({
    title: isNew ? 'Neuer Termin' : 'Termin bearbeiten', deleteLabel: isNew ? null : 'Löschen', variant: 'wide',
    fields: [
      { key: 'title', label: 'Titel', required: true, wide: true, value: base.title },
      { key: 'cal', label: 'Kalender', type: 'select', options: state.calendars.map(c => [c.id, c.name]), value: base.cal },
      { key: 'place', label: 'Ort', value: base.place },
      { key: 'start', label: 'Beginn', type: 'datetime-local', value: toInput(base.start) },
      { key: 'end', label: 'Ende', type: 'datetime-local', value: toInput(base.end) },
      { key: 'allDay', label: 'Ganztägig', type: 'checkbox', value: base.allDay },
      { key: 'repeat', label: 'Wiederholung', type: 'select', options: REPEATS, value: base.repeat },
      { key: 'remind', label: 'Erinnerung', type: 'select', options: REMINDERS, value: String(base.remind) },
      { key: 'attendees', label: 'Teilnehmer (E-Mail-Adressen)', wide: true, value: base.attendees, hint: 'Einladungen werden nach der Backend-Anbindung versendet.' },
      { key: 'desc', label: 'Beschreibung', type: 'textarea', wide: true, value: base.desc },
    ],
    validate: v => (fromInput(v.end) < fromInput(v.start) ? 'Das Ende liegt vor dem Beginn.' : ''),
  });
  if (!result) return;
  if (result.__delete) {
    if (!await askConfirm({ title: `Termin „${ev.title}“ löschen?`, message: ev.repeat !== 'none' ? 'Alle Wiederholungen dieses Termins werden gelöscht.' : 'Der Termin wird gelöscht.', confirm: 'Löschen', danger: true })) return;
    state.events = state.events.filter(e => e !== ev);
    toast('Termin gelöscht');
  } else {
    let start = fromInput(result.start);
    let end = fromInput(result.end);
    if (result.allDay) { start = startOfDay(start); end = startOfDay(end); }
    const data = { ...result, start, end, remind: Number(result.remind) };
    let saved = ev;
    if (isNew) { saved = { id: uid('e'), ...data }; state.events.push(saved); toast('Termin gespeichert'); } else { Object.assign(ev, data); toast('Termin aktualisiert'); }
    commit('save_event', { event: saved });
    render();
    return;
  }
  commit('delete_event', { id: ev.id });
  render();
}

function miniMonth(c) {

  const first = new Date(ref.getFullYear(), ref.getMonth(), 1).getTime();
  const start = weekStart(first);
  const cells = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  const today = startOfDay(Date.now());
  const shiftMonth = dir => { const d = new Date(c.date); d.setMonth(d.getMonth() + dir); c.date = startOfDay(d.getTime()); render(); };
  return h('div', {},
    h('div', { class: 'mini-head' }, h('span', { style: 'flex:1' }, `${MONTHS[ref.getMonth()]} ${ref.getFullYear()}`),
      iconButton({ label: 'Vorheriger Monat', iconName: 'chevronLeft', cls: 'btn--sm', on: { click: () => shiftMonth(-1) } }),
      iconButton({ label: 'Nächster Monat', iconName: 'chevronRight', cls: 'btn--sm', on: { click: () => shiftMonth(1) } })),

function renderCalendar() {

  const ref = new Date(c.date);
  const shift = dir => { const d = new Date(c.date); if (c.view === 'month') d.setMonth(d.getMonth() + dir); else d.setDate(d.getDate() + dir * (c.view === 'week' ? 7 : 1)); c.date = startOfDay(d.getTime()); render(); };

    class: `cal-ev${o.ev.allDay ? ' is-allday' : ''}`, type: 'button', style: `--c:${o.cal.color}`, title: `${o.ev.title}${o.ev.place ? ` · ${o.ev.place}` : ''}`,

  }, o.ev.allDay ? null : h('span', { class: 'dot' }), h('span', {}, o.ev.allDay ? o.ev.title : `${fmtClock(o.start)} ${o.ev.title}`));

  if (c.view === 'month') {

      })));
  } else {

    const n = week ? 7 : 1;
    const days = Array.from({ length: n }, (_, i) => addDays(start, i));
    const occ = occurrences(start, addDays(start, n));
    title = week ? `${fmtDate(days[0])} – ${fmtDate(days[6])}` : new Date(start).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

          WEEKDAYS[(new Date(day).getDay() + 6) % 7], h('button', { type: 'button', 'aria-label': fmtDate(day), on: { click: () => { c.date = day; c.view = 'day'; render(); } } }, String(new Date(day).getDate()))))),
        h('div', { class: 'cal-cols', style: `--cols:${n}` }, h('div', {}), days.map(day => h('div', { class: 'cal-allday' }, occ.filter(o => o.ev.allDay && o.start < day + DAY && o.end > day).map(chip))))),
      h('div', { class: 'cal-cols cal-grid', style: `--cols:${n}` },

        days.map(day => {
          const segs = layoutDay(occ.filter(o => !o.ev.allDay && o.start < day + DAY && o.end > day).map(o => ({ o, start: Math.max(o.start, day), end: Math.min(o.end, day + DAY) })));

          },
          segs.map(s => h('button', {
            class: 'cal-block', type: 'button', style: `--c:${s.o.cal.color};top:${((s.start - day) / 36e5) * HOUR_PX}px;height:${Math.max(22, ((s.end - s.start) / 36e5) * HOUR_PX - 2)}px;left:calc(${(s.lane / s.lanes) * 100}% + 2px);width:calc(${100 / s.lanes}% - 4px)`,
            on: { click: e => { e.stopPropagation(); editEvent(s.o.ev); } },
          }, h('strong', {}, s.o.ev.title), `${fmtClock(s.o.start)}${s.o.ev.place ? ` · ${s.o.ev.place}` : ''}`)),
          day === today ? h('div', { class: 'cal-now', style: `top:${((now - day) / 36e5) * HOUR_PX}px` }) : null);
        }))));
  }

  const main = h('section', { class: 'reader-pane', 'aria-label': 'Kalenderansicht' },
    h('div', { class: 'cal-bar' },
      drawerButton(),
      btn('Heute', { onClick: () => { c.date = today; render(); } }),
      iconButton({ label: 'Zurück', iconName: 'chevronLeft', on: { click: () => shift(-1) } }),
      iconButton({ label: 'Weiter', iconName: 'chevronRight', on: { click: () => shift(1) } }),
      h('h1', { class: 'cal-title' }, title), h('span', { class: 'spacer' }),
      makeSegmented('Ansicht', [['day', 'Tag'], ['week', 'Woche'], ['month', 'Monat']], c.view, value => { c.view = value; render(); }),
      btn('Neuer Termin', { iconName: 'plus', kind: 'accent', onClick: () => editEvent(null, { start: c.date + 9 * 36e5 }) })),
    body);
  const week = main.querySelector('.cal-week');
  if (week) requestAnimationFrame(() => { week.scrollTop = oldScroll ?? 7 * HOUR_PX; });
  return {
    overlay: false,
    side: [
      h('div', { class: 'sp-extra' }, miniMonth(c)),
      sectionHead('Kalender', 'Neuer Kalender', () => editCalendar()),
      h('div', { class: 'nav-group' }, state.calendars.map(cal => {

        return h('div', { class: 'cal-check', style: `--c:${cal.color}` }, box, h('label', { for: id }, cal.name),

      })),

      h('div', { class: 'nav-group' }, sideRow({ name: 'Importieren …', iconName: 'download', onClick: () => openImportExport() }), sideRow({ name: 'Als .ics exportieren', iconName: 'upload', onClick: exportIcs })),
    ],
    panes: [agendaPane(), staticResizer(), main],
  };
}

/* ==========================================================================
   16d. BACKEND-VERTRAG (Rust-ready)
   --------------------------------------------------------------------------
   Die Oberfläche spricht nur über `backend.invoke(befehl, argumente)`. Jeder Befehl
   entspricht später 1:1 einem Tauri-v2-Command (#[tauri::command], snake_case) oder
   einer Axum-Route. Heute läuft alles lokal (localStorage); sobald `window.__TAURI__`
   vorhanden ist, gehen die Aufrufe an das Rust-Backend.

   Datenform (serde-kompatibel): IDs sind Strings (später UUID), Zeitpunkte i64 in
   Millisekunden seit 1970, Enums kleingeschrieben (repeat: "none" | "daily" | …),
   Feldnamen camelCase (allDay). Die echten Rust-Typen stehen in
   crates/openmail-core/src/types.rs; die folgenden Skizzen sind nur eine Kurzfassung:

     struct Contact   { id: String, name: String, email: String, phone: String, org: String,
                        title: String, note: String, fav: bool, book: String }
     struct MailingList { id: String, name: String, members: Vec<String> }
     struct CalEvent  { id: String, cal: String, title: String, place: String, all_day: bool,
                        start: i64, end: i64, repeat: Repeat, remind: i32, attendees: String, desc: String }
     struct Task      { id: String, cal: String, title: String, due: Option<i64>, prio: Prio,
                        done: bool, note: String }
     struct ChatRoom  { id: String, acc: String, kind: RoomKind, name: String, topic: String,
                        unread: u32, members: Vec<String>, messages: Vec<ChatMessage> }
     struct MailFilter { id: String, name: String, on: bool, match_all: bool,
                        rules: Vec<Rule>, actions: Vec<Action> }

   Hinweis zur späteren Tauri-App: Inline-Skripte brauchen eine CSP mit Hash/Nonce
   (script-src 'self' 'sha256-…'), Nutzereingaben werden hier ausschließlich als
   Textknoten gerendert (kein innerHTML mit fremden Daten).
   ========================================================================== */
const BACKEND_COMMANDS = [
  'list_address_books', 'save_address_book', 'delete_address_book',
  'list_contacts', 'save_contact', 'delete_contact', 'save_mailing_list', 'delete_mailing_list',
  'list_calendars', 'save_calendar', 'delete_calendar', 'list_events', 'save_event', 'delete_event',
  'list_tasks', 'save_task', 'delete_task',
  'list_chat_rooms', 'send_chat_message', 'save_chat_account', 'join_chat_room', 'set_chat_status',
  'list_filters', 'save_filter', 'delete_filter', 'run_filters', 'save_search', 'delete_search',
  'save_account', 'detect_account_settings', 'save_settings',
  'import_file', 'export_contacts_vcard', 'export_calendar_ics',
];
const backend = {
  get mode() { return window.__TAURI__?.core?.invoke ? 'tauri' : 'local'; },
  /** Lokal: der Zustand wurde bereits optimistisch geändert und gespeichert, es gibt nichts weiter zu tun. */
  async invoke(command, args = {}) {
    if (!BACKEND_COMMANDS.includes(command)) throw new Error(`Unbekannter Befehl: ${command}`);
    if (this.mode === 'tauri') return window.__TAURI__.core.invoke(command, args);
    return null;
  },
};
/** Speichert lokal und meldet die Änderung dem Backend (optimistisches Update). */
function commit(command, payload) {
  persist();
  backend.invoke(command, payload).catch(() => toast('Das Backend hat die Änderung nicht übernommen.'));
}

const PRIOS = [['high', 'Hoch'], ['normal', 'Normal'], ['low', 'Niedrig']];
const TASK_FILTERS = [['open', 'Offen', 'tasks'], ['today', 'Heute', 'clock'], ['week', 'Nächste 7 Tage', 'calendar'], ['overdue', 'Überfällig', 'spam'], ['done', 'Erledigt', 'check'], ['all', 'Alle', 'folder']];

function taskMatches(t, filter) {
  const now = Date.now();
  const dayEnd = startOfDay(now) + DAY;
  switch (filter) {
    case 'open': return !t.done;
    case 'today': return !t.done && t.due !== null && t.due < dayEnd;
    case 'week': return !t.done && t.due !== null && t.due < dayEnd + 6 * DAY;
    case 'overdue': return !t.done && t.due !== null && t.due < now;
    case 'done': return t.done;
    default: return true;
  }
}

function tasksIn(filter, calId, query) {
  const q = query.trim().toLowerCase();
  return state.tasks
    .filter(t => taskMatches(t, filter) && (calId === 'all' || t.cal === calId) && (!q || `${t.title} ${t.note}`.toLowerCase().includes(q)))
    .sort((a, b) => Number(a.done) - Number(b.done) || (a.due ?? Infinity) - (b.due ?? Infinity));
}

async function editTask(task) {
  const isNew = !task;
  const result = await formDialog({
    title: isNew ? 'Neue Aufgabe' : 'Aufgabe bearbeiten', deleteLabel: isNew ? null : 'Löschen',
    fields: [
      { key: 'title', label: 'Titel', required: true, wide: true, value: task?.title },
      { key: 'cal', label: 'Kalender', type: 'select', options: state.calendars.map(c => [c.id, c.name]), value: task?.cal ?? state.calendars[0].id },
      { key: 'prio', label: 'Priorität', type: 'select', options: PRIOS, value: task?.prio ?? 'normal' },
      { key: 'due', label: 'Fällig am', type: 'datetime-local', wide: true, value: task?.due ? toInput(task.due) : '' },
      { key: 'note', label: 'Notiz', type: 'textarea', wide: true, value: task?.note },
    ],
  });
  if (!result) return;
  if (result.__delete) {
    if (!await askConfirm({ title: `Aufgabe „${task.title}“ löschen?`, message: 'Die Aufgabe wird endgültig gelöscht.', confirm: 'Löschen', danger: true })) return;
    state.tasks = state.tasks.filter(t => t !== task);
    if (sp.tasks.sel === task.id) sp.tasks.sel = null;
    ui.spaceOpen = false;
    commit('delete_task', { id: task.id });
    toast('Aufgabe gelöscht');
  } else {
    const data = { ...result, due: fromInput(result.due) };
    let saved = task;
    if (isNew) { saved = { id: uid('t'), done: false, ...data }; state.tasks.push(saved); } else Object.assign(task, data);
    commit('save_task', { task: saved });
    toast('Aufgabe gespeichert');
  }
  render();
}

function toggleTask(task) {
  task.done = !task.done;
  commit('save_task', { task });
  render();
  toast(task.done ? 'Aufgabe erledigt' : 'Aufgabe wieder geöffnet');

function renderTasks() {
  const s = sp.tasks;
  const listBox = h('div', { class: 'list-scroll' });

/* ==========================================================================
   16g. WERKZEUGE: FILTER, KONTEN, ADD-ONS, AKTIVITÄTEN, IMPORT/EXPORT
   ========================================================================== */
const FILTER_FIELDS = [['from', 'Absender'], ['to', 'Empfänger'], ['subject', 'Betreff'], ['body', 'Nachrichtentext']];
const FILTER_OPS = [['contains', 'enthält'], ['not', 'enthält nicht'], ['is', 'ist'], ['starts', 'beginnt mit']];
const FILTER_ACTIONS = [['move', 'Verschieben nach'], ['label', 'Kategorie zuweisen'], ['star', 'Markieren'], ['read', 'Als gelesen markieren'], ['delete', 'In den Papierkorb']];
const nameOf = (list, id) => list.find(x => x[0] === id)?.[1] ?? id;

const moveOptions = () => [['archive', 'Archiv'], ['spam', 'Spam'], ['trash', 'Papierkorb'], ...customFolders().map(f => [f.id, f.name])];

function mailText(m, field) {
  if (field === 'from') return `${m.from.name} ${m.from.email}`;
  if (field === 'to') return m.to.map(p => `${p.name} ${p.email}`).join(' ');
  if (field === 'subject') return m.subject;
  return plainText(m.body);
}

function ruleMatches(m, rule) {
  const needle = rule.value.trim().toLowerCase();
  if (!needle) return false;
  const hay = mailText(m, rule.field).toLowerCase();
  if (rule.op === 'not') return !hay.includes(needle);
  if (rule.op === 'is') return hay.trim() === needle || hay.split(/\s+/).includes(needle);
  if (rule.op === 'starts') return hay.startsWith(needle);
  return hay.includes(needle);
}

// Liefert true, wenn die Aktion angewendet wurde; veraltete Ziele (gelöschter Ordner/Kategorie) werden übersprungen.
function applyFilterAction(m, action) {
  if (action.type === 'move') {
    const ok = ['archive', 'spam', 'trash'].includes(action.value) || state.folders.some(f => f.id === action.value && f.account === m.account);
    if (!ok) return false;
    m.folder = action.value;
  } else if (action.type === 'label') {
    if (!labelById(action.value)) return false;
    if (!m.labels.includes(action.value)) m.labels.push(action.value);
  } else if (action.type === 'star') m.starred = true;
  else if (action.type === 'read') m.read = true;
  else if (action.type === 'delete') m.folder = 'trash';
  return true;
}

function runFilters() {
  const active = state.filters.filter(f => f.on && f.rules.length);
  let touched = 0;
  for (const m of state.mails.filter(x => x.account === state.activeAccount && x.folder === 'inbox')) {
    for (const f of active) {
      const hits = f.rules.map(r => ruleMatches(m, r));
      if (!(f.match === 'all' ? hits.every(Boolean) : hits.some(Boolean))) continue;
      let applied = false;
      for (const a of f.actions) if (applyFilterAction(m, a)) applied = true;
      if (applied) touched++;
      if (m.folder !== 'inbox') break;
    }
  }
  commit('run_filters', { account: state.activeAccount });
  render();
  toast(touched ? `${touched} ${plural(touched, 'Nachricht', 'Nachrichten')} gefiltert` : 'Keine Nachricht entsprach den Filtern');
}

const filterSummary = f => `${f.match === 'all' ? 'Alle' : 'Eine'} Bedingung${f.match === 'all' ? 'en' : ''}: ${f.rules.map(r => `${nameOf(FILTER_FIELDS, r.field)} ${nameOf(FILTER_OPS, r.op)} „${r.value}“`).join(', ')} → ${f.actions.map(a => `${nameOf(FILTER_ACTIONS, a.type)}${a.type === 'move' ? ` ${nameOf(moveOptions(), a.value)}` : a.type === 'label' ? ` ${labelById(a.value)?.name ?? ''}` : ''}`).join(', ')}`;

const selectEl = (options, value, onChange, label) => {
  const el = h('select', { class: 'input', 'aria-label': label }, options.map(([v, t]) => h('option', { value: v, selected: v === value }, t)));
  el.addEventListener('change', () => onChange(el.value));
  return el;
};

async function editFilter(filter, preset = {}) {
  const draft = filter ? structuredClone(filter) : { id: uid('fl'), name: '', on: true, match: 'any', rules: [{ field: 'from', op: 'contains', value: preset.from ?? '' }], actions: [{ type: 'move', value: 'archive' }] };
  const rulesBox = h('div');
  const actionsBox = h('div');
  const error = h('p', { class: 'field-error', role: 'alert' });
  const nameInput = h('input', { class: 'input', type: 'text', value: draft.name, autocomplete: 'off', 'aria-label': 'Name des Filters' });
  const paintRules = () => rulesBox.replaceChildren(...draft.rules.map((r, i) => h('div', { class: 'rule-row' },
    selectEl(FILTER_FIELDS, r.field, v => { r.field = v; }, 'Feld'), selectEl(FILTER_OPS, r.op, v => { r.op = v; }, 'Bedingung'),
    h('input', { class: 'input', type: 'text', value: r.value, 'aria-label': 'Wert', on: { input: e => { r.value = e.target.value; } } }),
    iconButton({ label: 'Bedingung entfernen', iconName: 'close', on: { click: () => { if (draft.rules.length > 1) { draft.rules.splice(i, 1); paintRules(); } } } }))));
  const paintActions = () => actionsBox.replaceChildren(...draft.actions.map((a, i) => h('div', { class: 'rule-row' },
    selectEl(FILTER_ACTIONS, a.type, v => { a.type = v; a.value = v === 'move' ? 'archive' : v === 'label' ? state.labels[0]?.id : undefined; paintActions(); }, 'Aktion'),
    a.type === 'move' ? selectEl(moveOptions(), a.value, v => { a.value = v; }, 'Zielordner') : a.type === 'label' ? selectEl(state.labels.map(l => [l.id, l.name]), a.value, v => { a.value = v; }, 'Kategorie') : h('span', {}),
    h('span', {}),
    iconButton({ label: 'Aktion entfernen', iconName: 'close', on: { click: () => { if (draft.actions.length > 1) { draft.actions.splice(i, 1); paintActions(); } } } }))));
  paintRules();
  paintActions();
  const result = await showDialog({
    title: filter ? 'Filter bearbeiten' : 'Neuer Filter', variant: 'wide',
    content: () => h('div', {},
      h('label', { class: 'field-label' }, 'Name'), nameInput,
      h('div', { class: 'set-row' }, h('span', {}, 'Nachricht trifft zu, wenn'), selectEl([['any', 'mindestens eine Bedingung'], ['all', 'alle Bedingungen']], draft.match, v => { draft.match = v; }, 'Verknüpfung')),
      rulesBox, btn('Bedingung hinzufügen', { iconName: 'plus', onClick: () => { draft.rules.push({ field: 'subject', op: 'contains', value: '' }); paintRules(); } }),
      h('h3', { class: 'set-title', style: 'margin-top:var(--sp-4)' }, 'Dann'), actionsBox,
      btn('Aktion hinzufügen', { iconName: 'plus', onClick: () => { draft.actions.push({ type: 'star' }); paintActions(); } }), error),
    buttons: [{ label: 'Abbrechen', value: null }, {
      label: 'Speichern', kind: 'accent', value: () => draft,
      onClick: () => {
        draft.name = nameInput.value.trim();
        if (!draft.name) { error.textContent = 'Bitte einen Namen eingeben.'; nameInput.focus(); return false; }
        if (draft.rules.some(r => !r.value.trim())) { error.textContent = 'Jede Bedingung braucht einen Wert.'; return false; }
        return undefined;
      },
    }],
  });
  return result;
}

/* ---- Kontoassistent (Account Hub) ---- */
function detectSettings(email) {
  const domain = email.split('@')[1] || 'example.org';
  return { imap: `imap.${domain}`, imapPort: 993, imapSec: 'ssl', smtp: `smtp.${domain}`, smtpPort: 587, smtpSec: 'starttls', auth: 'oauth2' };
}

async function addMailAccount() {
  const info = await formDialog({
    title: 'E-Mail-Konto einrichten', confirm: 'Weiter',
    fields: [
      { key: 'name', label: 'Ihr Name', required: true, wide: true },
      { key: 'email', label: 'E-Mail-Adresse', type: 'email', required: true, wide: true },
      { key: 'password', label: 'Passwort', type: 'password', wide: true, hint: 'Das Passwort wird nicht in der App gespeichert. Die Anmeldung übernimmt später das Backend.' },
    ],
    validate: v => (EMAIL_RE.test(v.email) ? '' : 'Bitte eine gültige E-Mail-Adresse eingeben.'),
  });
  if (!info) return;
  delete info.password;
  const cfg = detectSettings(info.email);
  const ok = await showDialog({
    title: 'Konfiguration gefunden',
    content: () => h('div', {}, h('p', { class: 'set-hint' }, 'Diese Einstellungen wurden anhand der Domain ermittelt. Du kannst sie später in den Konten-Einstellungen ändern.'),
      propList([['Posteingang', `${cfg.imap}:${cfg.imapPort} · SSL/TLS (IMAP)`], ['Postausgang', `${cfg.smtp}:${cfg.smtpPort} · STARTTLS (SMTP)`], ['Anmeldung', 'OAuth2'], ['Benutzername', info.email]])),
    buttons: [{ label: 'Abbrechen', value: false }, { label: 'Fertigstellen', kind: 'accent', value: true }],
  });
  if (!ok) return;
  const label = (info.email.split('@')[1] || 'Konto').split('.')[0];

function accountField(account, f) {
  account.cfg ??= {};
  const get = () => (f.prop ? account[f.key] : account.cfg[f.key] ?? f.def(account));
  const set = value => { if (f.prop) account[f.key] = value; else account.cfg[f.key] = value; commit('save_account', { account }); };
  const id = uid('acf');
  if (f.type === 'switch') return h('div', { class: 'set-row' }, h('span', { id }, f.label), makeSwitch(id, Boolean(get()), set));
  const control = f.type === 'select'
    ? h('select', { class: 'input', id }, f.options.map(([v, t]) => h('option', { value: v, selected: String(v) === String(get()) }, t)))
    : h('input', { class: 'input', id, type: f.type, value: get(), autocomplete: 'off' });
  control.addEventListener(f.type === 'select' ? 'change' : 'input', e => set(f.type === 'number' ? Number(e.target.value) : e.target.value));
  return h('div', { class: 'set-stack' }, h('label', { class: 'field-label', for: id }, f.label), control);
}

function openSettings(sectionId = 'appearance', accountId = state.activeAccount) {
  const items = SETTINGS_TREE.flatMap(c => c.items.map(i => ({ ...i, cat: c.cat })));

  const panel = h('div', { class: 'settings-panel' });
  const notifyId = uid('notify');
  const convId = uid('conv');

  const build = item => {
    switch (item.id) {
      case 'appearance': return [
        h('section', { class: 'set-section' }, h('h3', { class: 'set-title' }, 'Farbschema'),
          makeSegmented('Farbschema', THEMES.map(([id, name]) => [id, name === 'Systemeinstellung' ? 'Automatisch' : name]), state.settings.theme, value => { state.settings.theme = value; persist(); applyTheme(); })),

          makeSegmented('Anzeigedichte', [['compact', 'Kompakt'], ['normal', 'Normal'], ['roomy', 'Geräumig']], state.settings.density, value => { state.settings.density = value; persist(); render(); })),
      ];
      case 'reading': return [
        h('section', { class: 'set-section' }, h('h3', { class: 'set-title' }, 'Lesebereich'),
          makeSegmented('Position des Lesebereichs', [['right', 'Rechts'], ['bottom', 'Unten'], ['off', 'Aus']], state.settings.pane, value => { state.settings.pane = value; persist(); render(); }),
          h('p', { class: 'set-hint' }, 'Rechts und unten gelten ab 1100 px Fensterbreite. Darunter öffnet sich der Lesebereich als Overlay.')),
        h('section', { class: 'set-section' }, h('h3', { class: 'set-title' }, 'Konversationen'),
          h('div', { class: 'set-row' }, h('span', { id: convId }, 'Nachrichten als Konversationen anzeigen'), makeSwitch(convId, state.settings.conversations, value => { state.settings.conversations = value; persist(); render(); }))),
      ];
      case 'notify': return [h('section', { class: 'set-section' },
        h('div', { class: 'set-row' }, h('span', { id: notifyId }, 'Hinweis bei neuen Nachrichten'), makeSwitch(notifyId, state.settings.notifications, async value => {
          state.settings.notifications = value;
          persist();
          if (value && 'Notification' in window && Notification.permission === 'default') {
            try { await Notification.requestPermission(); } catch { /* Berechtigungsabfrage nicht möglich: Hinweise erscheinen weiterhin in der App */ }
          }
        })),
        h('p', { class: 'set-hint' }, 'Bei sichtbarem Fenster erscheint ein Hinweis in der App, sonst eine Systembenachrichtigung (falls erlaubt).'))];
      case 'signature': return signatureSection(account);
      case 'filters': return openTool(openFilters, 'Nachrichtenfilter verwalten …', 'filter', 'Filter sortieren, kennzeichnen oder verschieben Nachrichten automatisch.');
      case 'addons': return openTool(openAddons, 'Add-ons und Themes öffnen …', 'puzzle', 'Erweiterungen, Themes und Wörterbücher verwalten.');
      case 'io': return openTool(() => openImportExport(), 'Importieren und exportieren …', 'download', 'Daten aus anderen Programmen übernehmen oder sichern.');
      case 'activity': return openTool(openActivity, 'Aktivitäten anzeigen …', 'activity', 'Verlauf der letzten Aktionen, zum Beispiel Synchronisation und Downloads.');
      case 'shortcuts': return openTool(showShortcuts, 'Tastaturkürzel anzeigen …', 'keyboard', 'Alle Kürzel für die Bedienung ohne Maus.');
      case 'reset': return openTool(resetDemo, 'Demo-Daten zurücksetzen …', 'trash', 'Setzt alle Änderungen zurück und legt die Beispielnachrichten neu an.');
      default: {
        const section = ACCOUNT_SECTIONS.find(s => s.id === item.id);
        const nodes = section ? section.fields.map(f => accountField(account, f)) : [];
        if (section?.keys) nodes.push(accountKeys(account));
        if (item.id === 'identity') {
          nodes.push(h('div', { class: 'set-stack', style: 'flex-direction:row;flex-wrap:wrap;margin-top:var(--sp-4)' },
            btn('Konto hinzufügen …', { iconName: 'plus', onClick: () => { closeAllDialogs(); setTimeout(openAccountHub, 0); } }),
            ...(state.accounts.length > 1 ? [btn('Konto entfernen …', { iconName: 'trash', onClick: () => removeAccount(account) })] : [])));
        }
        return nodes;
      }
    }
  };

  function paint() {
    nav.replaceChildren(...SETTINGS_TREE.flatMap(cat => [
      h('div', { class: 'nav-section' }, h('span', { class: 'nav-section-title' }, cat.cat)),
      ...cat.items.map(i => h('button', { class: 'btn', type: 'button', 'aria-current': String(i.id === current), on: { click: () => { current = i.id; paint(); } } }, i.name)),
    ]));

    panel.replaceChildren(h('p', { class: 'set-hint', style: 'margin:0' }, item.cat), h('h3', { class: 'set-heading' }, item.name), picker, ...build(item));
    panel.scrollTop = 0;
  }
  paint();
  showDialog({ title: 'Einstellungen', variant: 'settings', closable: true, content: () => h('div', { class: 'settings-split' }, select, nav, panel) });
}

async function removeAccount(account) {
  if (state.accounts.length < 2) return;
  const ok = await askConfirm({ title: `Konto „${account.email}“ entfernen?`, message: 'Alle Nachrichten und Ordner dieses Kontos werden aus der App entfernt.', confirm: 'Entfernen', danger: true });
  if (!ok) return;
  closeAllDialogs();
  state.mails = state.mails.filter(m => m.account !== account.id);
  state.folders = state.folders.filter(f => f.account !== account.id);
  state.accounts = state.accounts.filter(a => a !== account);
  if (state.activeAccount === account.id) { state.activeAccount = state.accounts[0].id; state.view.folder = 'inbox'; resetSelection(); }
  commit('save_account', { removed: account.id });
  render();
  toast('Konto entfernt');
}
