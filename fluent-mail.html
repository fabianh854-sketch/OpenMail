<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OpenMail</title>
<style>
/* ==========================================================================
   1. DESIGN TOKENS (Kiesel – Hell/Dunkel nach Systemeinstellung)
   ========================================================================== */
:root {
  color-scheme: light dark;

  /* Kiesel-Rohwerte (Hell) */
  --paper: #F4F5F4;
  --surface: #FFFFFF;
  --fog: #E4E8E9;
  --line: #DFE3E4;
  --control-border: #7F8A92;
  --ink: #22272B;
  --ink-muted: #566068;
  --accent: #5B6670;
  --on-accent: #FFFFFF;
  --accent-text: #4A5560;
  --sage: #D5E0D6;
  --on-sage: #1F3A2C;
  --moss: #4F6F5C;
  --clay: #F3E1D9;
  --on-clay: #7A3419;
  --clay-mark: #9A4A2E;
  --shadow-float: 0 1px 2px rgba(34, 39, 43, 0.06), 0 16px 32px -16px rgba(34, 39, 43, 0.16);

  /* Abgeleitet: bestehende App-Variablen auf Kiesel abgebildet */
  --bg-app: var(--paper);
  --bg-panel: var(--surface);
  --bg-card: var(--fog);
  --bg-active: color-mix(in srgb, var(--fog) 82%, var(--ink));

  --fg-primary: var(--ink);
  --fg-secondary: color-mix(in srgb, var(--ink) 55%, var(--ink-muted));
  --fg-tertiary: var(--ink-muted);

  --accent-hover: color-mix(in srgb, var(--accent) 85%, var(--ink));
  --accent-pressed: color-mix(in srgb, var(--accent) 70%, var(--ink));

  --stroke: var(--line);
  --stroke-strong: color-mix(in srgb, var(--line) 45%, var(--control-border));

  /* Status (Grün nur für Erfolg, Ton für Fehler; der Favoriten-Stern nutzt den Akzent) */
  --success: var(--moss);
  --warning: var(--accent);
  --danger: var(--clay-mark);

  /* Dateitypen */
  --file-pres: var(--ink-muted);
  --file-image: var(--ink-muted);

  /* Flächen ohne Glas: Kiesel trennt über Haarlinien */
  --acrylic: var(--paper);
  --acrylic-strong: var(--surface);
  --blur: none;
  --scrim: color-mix(in srgb, var(--ink) 40%, transparent);

  /* Fokus */
  --focus-outer: var(--accent);
  --focus-inner: var(--paper);

  /* Radien */
  --r-control: 10px;
  --r-card: 16px;
  --r-dialog: 24px;

  /* Elevation (nur Overlays tragen den Float-Schatten) */
  --shadow-2: none;
  --shadow-4: none;
  --shadow-8: none;
  --shadow-16: var(--shadow-float);

  /* Motion */
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --t-fast: 120ms;
  --t-base: 200ms;
  --t-slow: 200ms;

  /* Typografie */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Inter Tight", "Inter", system-ui, sans-serif;
  --fs-caption: 12px;
  --fs-body: 14px;
  --fs-subtitle: 20px;
  --fs-title: 28px;

  /* Abstände */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;

  /* Layout */
  --sidebar-w: 260px;
  --rail-w: 56px;
  --list-w: 360px;
  --list-h: 340px;

  /* Dichte (Normal) */
  --row-pad-y: 10px;
  --preview-lines: 2;
}

:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15191C;
    --surface: #1E2327;
    --fog: #262D32;
    --line: #2E363C;
    --control-border: #6B7780;
    --ink: #E8ECEE;
    --ink-muted: #9CA8B0;
    --accent: #A9B8C3;
    --on-accent: #15191C;
    --accent-text: #A9B8C3;
    --sage: #22382C;
    --on-sage: #BFDCCB;
    --moss: #7FA891;
    --clay: #3A2620;
    --on-clay: #F0B8A3;
    --clay-mark: #E59A7F;
    --shadow-float: 0 20px 40px -20px rgba(0, 0, 0, 0.6);
    --accent-hover: color-mix(in srgb, var(--accent) 85%, var(--paper));
    --accent-pressed: color-mix(in srgb, var(--accent) 70%, var(--paper));
    --bg-active: color-mix(in srgb, var(--fog) 80%, var(--ink));
  }
}
:root[data-theme="dark"] {
  --paper: #15191C;
  --surface: #1E2327;
  --fog: #262D32;
  --line: #2E363C;
  --control-border: #6B7780;
  --ink: #E8ECEE;
  --ink-muted: #9CA8B0;
  --accent: #A9B8C3;
  --on-accent: #15191C;
  --accent-text: #A9B8C3;
  --sage: #22382C;
  --on-sage: #BFDCCB;
  --moss: #7FA891;
  --clay: #3A2620;
  --on-clay: #F0B8A3;
  --clay-mark: #E59A7F;
  --shadow-float: 0 20px 40px -20px rgba(0, 0, 0, 0.6);
  --accent-hover: color-mix(in srgb, var(--accent) 85%, var(--paper));
  --accent-pressed: color-mix(in srgb, var(--accent) 70%, var(--paper));
  --bg-active: color-mix(in srgb, var(--fog) 80%, var(--ink));
}

[data-density="compact"] { --row-pad-y: 5px; --preview-lines: 1; }
[data-density="roomy"] { --row-pad-y: 16px; --preview-lines: 2; }

/* ==========================================================================
   2. BASIS
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
* { scrollbar-width: thin; scrollbar-color: var(--control-border) transparent; }

html, body { height: 100%; }

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg-app);
  color: var(--fg-primary);
  font: 400 var(--fs-body) / 20px var(--font);
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; }
.brand, .list-title, .thread-subject, .dialog-title, .reader-empty h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.02em; }
[hidden] { display: none !important; }
mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 2px; }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus-outer);
  outline-offset: 1px;
  box-shadow: 0 0 0 1px var(--focus-inner);
}
.ring-within:focus-within {
  outline: 2px solid var(--focus-outer);
  outline-offset: 1px;
  box-shadow: 0 0 0 1px var(--focus-inner);
}
.ring-within :focus-visible { outline: none; box-shadow: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: var(--sp-2); top: -48px; z-index: 1000;
  padding: var(--sp-2) var(--sp-4); background: var(--bg-active);
  color: var(--fg-primary); border-radius: var(--r-control);
}
.skip-link:focus { top: var(--sp-2); }

.icon {
  width: 20px; height: 20px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.icon-lg { width: 48px; height: 48px; stroke-width: 1.2; }

/* Reveal-Highlight: Lichtverlauf folgt dem Mauszeiger */
.reveal { position: relative; }
.reveal::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; opacity: 0;
  background: radial-gradient(circle 110px at var(--mouse-x, 50%) var(--mouse-y, 50%), color-mix(in srgb, var(--ink) 6%, transparent), transparent 100%);
  transition: opacity var(--t-base) var(--ease);
}
.reveal:hover::after { opacity: 1; }

/* ==========================================================================
   3. LAYOUT
   ========================================================================== */
.app {
  position: relative; display: flex; height: 100vh; height: 100dvh; overflow: hidden;
  background: var(--bg-app);
}

/* ---- Sidebar ---- */
.sidebar {
  width: var(--sidebar-w); flex: none; display: flex; flex-direction: column;
  padding: var(--sp-2); gap: var(--sp-2);
  background: var(--acrylic);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-right: 1px solid var(--stroke);
  transition: width var(--t-slow) var(--ease), transform var(--t-slow) var(--ease);
  overflow: hidden; z-index: 5;
}
.sidebar-top { display: flex; align-items: center; gap: var(--sp-2); min-height: 40px; }
.brand { font-weight: 600; font-size: 16px; white-space: nowrap; }

.compose-btn { width: 100%; min-height: 36px; justify-content: flex-start; padding: 0 var(--sp-3); }

.nav { flex: 1; overflow-y: auto; overflow-x: hidden; margin: 0 calc(var(--sp-1) * -1); padding: 0 var(--sp-1); }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-section {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: var(--sp-4); padding: 0 var(--sp-1) 0 var(--sp-3);
  color: var(--fg-tertiary); font-size: var(--fs-caption); font-weight: 600;
}
.nav-row { display: flex; align-items: center; border-radius: var(--r-control); transition: background var(--t-fast) var(--ease); }
.nav-row:hover { background: var(--bg-card); }
.nav-row[data-current="true"] { background: var(--bg-active); }
.nav-row[data-current="true"]::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
  border-radius: 2px; background: var(--accent);
}
.nav-row.drop-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--bg-card); }
.nav-item {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--sp-3);
  height: 36px; padding: 0 var(--sp-3); border: 0; border-radius: inherit;
  background: transparent; color: var(--fg-secondary); text-align: left;
}
.nav-row[data-current="true"] .nav-item { color: var(--fg-primary); font-weight: 600; }
.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-badge { color: var(--fg-tertiary); font-size: var(--fs-caption); }
.nav-badge.is-unread { color: var(--accent); font-weight: 600; }
.nav-more { opacity: 0; margin-right: 2px; transition: opacity var(--t-fast) var(--ease); }
.nav-row:hover .nav-more, .nav-row:focus-within .nav-more { opacity: 1; }

.dot { width: 10px; height: 10px; flex: none; margin: 0 5px; border-radius: 50%; background: var(--dot, var(--accent)); }

.sidebar-bottom { display: flex; align-items: center; gap: var(--sp-1); padding-top: var(--sp-2); border-top: 1px solid var(--stroke); }
.account-btn { flex: 1; min-width: 0; justify-content: flex-start; gap: var(--sp-2); padding: var(--sp-1) var(--sp-2); height: 48px; text-align: left; }
.account-text { min-width: 0; display: flex; flex-direction: column; line-height: 16px; }
.account-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-mail { color: var(--fg-tertiary); font-size: var(--fs-caption); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (min-width: 720px) {
  .app.rail .sidebar { width: var(--rail-w); }
  .app.rail .nav-label, .app.rail .brand, .app.rail .btn-text, .app.rail .nav-more,
  .app.rail .nav-section-title, .app.rail .account-text, .app.rail .account-chevron { display: none; }
  .app.rail .nav-item { padding: 0; justify-content: center; }
  .app.rail .nav-badge { position: absolute; top: 5px; right: 6px; min-width: 8px; height: 8px; padding: 0; border-radius: 4px; background: var(--accent); font-size: 0; }
  .app.rail .nav-badge:not(.is-unread) { display: none; }
  .app.rail .nav-section { justify-content: center; padding: 0; margin-top: var(--sp-2); }
  .app.rail .nav-section::before { content: ""; width: 24px; height: 1px; background: var(--stroke-strong); }
  .app.rail .nav-section .btn { display: none; }
  .app.rail .compose-btn { justify-content: center; padding: 0; }
  .app.rail .sidebar-bottom { flex-direction: column; }
  .app.rail .account-btn { flex: none; width: 40px; padding: 0; justify-content: center; }
  .app.rail .nav-row[data-current="true"]::before { top: 12px; bottom: 12px; }
}

.scrim { display: none; }

/* ---- Inhaltsbereich ---- */
.content { position: relative; flex: 1; min-width: 0; display: flex; padding: var(--sp-2); }
.list-pane, .reader-pane {
  min-width: 0; display: flex; flex-direction: column;
  background: var(--bg-panel); border: 1px solid var(--stroke);
  border-radius: var(--r-card); box-shadow: var(--shadow-2); overflow: hidden;
}
.list-pane { width: var(--list-w); flex: none; }
.reader-pane { flex: 1; container-type: inline-size; }

.resizer { position: relative; flex: none; width: 8px; cursor: col-resize; touch-action: none; }
.resizer::after {
  content: ""; position: absolute; top: 12px; bottom: 12px; left: 3px; width: 2px;
  border-radius: 1px; background: transparent; transition: background var(--t-fast) var(--ease);
}
.resizer:hover::after, .resizer.is-dragging::after { background: var(--accent); }

.content[data-pane="bottom"] { flex-direction: column; }
.content[data-pane="bottom"] .list-pane { width: auto; height: var(--list-h); }
.content[data-pane="bottom"] .resizer { width: auto; height: 8px; cursor: row-resize; }
.content[data-pane="bottom"] .resizer::after { top: 3px; bottom: auto; left: 12px; right: 12px; width: auto; height: 2px; }

/* Overlay-Modus (unter 1100 px oder Lesebereich aus) */
.cmd-back { display: none; }
.content[data-overlay="true"] .cmd-back { display: inline-flex; }
.content[data-overlay="true"] .list-pane { flex: 1; width: auto; height: auto; }
.content[data-overlay="true"] .resizer { display: none; }
.content[data-overlay="true"] .reader-pane {
  position: absolute; top: var(--sp-2); right: var(--sp-2); bottom: var(--sp-2);
  width: min(780px, calc(100% - 16px)); z-index: 20;
  background: var(--acrylic-strong);
  -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--shadow-16);
  transform: translateX(calc(100% + 24px)); visibility: hidden;
  transition: transform var(--t-slow) var(--ease), visibility 0s linear var(--t-slow);
}
.content[data-overlay="true"][data-open="true"] .reader-pane {
  transform: none; visibility: visible;
  transition: transform var(--t-slow) var(--ease), visibility 0s;
}

@media (max-width: 719px) {
  .sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 60;
    width: min(300px, 86vw); background: var(--acrylic-strong);
    transform: translateX(-100%); box-shadow: var(--shadow-16);
  }
  .app[data-drawer="open"] .sidebar { transform: none; }
  .app[data-drawer="open"] .scrim { display: block; position: fixed; inset: 0; z-index: 50; background: var(--scrim); }
  .content { padding: 0; }
  .list-pane, .reader-pane { border-radius: 0; border: 0; box-shadow: none; }
  .content[data-overlay="true"] .reader-pane { top: 0; right: 0; bottom: 0; width: 100%; }
}
.only-narrow { display: none !important; }
@media (max-width: 719px) { .only-narrow { display: inline-flex !important; } }

/* ==========================================================================
   4. KOMPONENTEN
   ========================================================================== */

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 32px; padding: 0 var(--sp-3); border: 1px solid transparent;
  border-radius: var(--r-control); background: transparent; color: var(--fg-primary);
  white-space: nowrap; user-select: none;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.btn:hover { background: var(--bg-card); }
.btn:active { background: var(--bg-active); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.btn[aria-pressed="true"], .btn[aria-haspopup][aria-expanded="true"], .btn[aria-controls][aria-expanded="true"] { background: var(--bg-active); }
.btn--icon { width: 32px; padding: 0; flex: none; }
.btn--sm { min-height: 24px; width: 24px; }
.btn--standard { background: var(--bg-card); border-color: var(--stroke-strong); }
.btn--standard:hover { background: var(--bg-active); }
.btn--accent { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn--accent:hover { background: var(--accent-hover); }
.btn--accent:active { background: var(--accent-pressed); }
.btn--danger { background: var(--danger); color: var(--on-accent); font-weight: 600; }
.btn--danger:hover { background: color-mix(in srgb, var(--danger) 85%, var(--ink)); }
.btn--danger:active { background: color-mix(in srgb, var(--danger) 70%, var(--ink)); }

/* ---- Eingabefelder ---- */
.input {
  width: 100%; min-height: 32px; padding: 0 var(--sp-2);
  background: var(--bg-panel); border: 1px solid var(--control-border);
  border-radius: var(--r-control);
  color: var(--fg-primary);
}
.input:focus { border-color: var(--accent); }
textarea.input { padding: var(--sp-2); resize: vertical; line-height: 20px; }
select.input { padding-right: var(--sp-1); }
::placeholder { color: var(--fg-tertiary); opacity: 1; }
.field-label { display: block; margin-bottom: var(--sp-1); color: var(--fg-secondary); font-size: var(--fs-caption); }
/* Ohne Inline-Style, damit die CSP (style-src 'self') nichts blockiert. */
.field-label-inline { margin: 0; }
.field-error { margin: var(--sp-1) 0 0; min-height: 16px; color: var(--danger); font-size: var(--fs-caption); }

/* ---- Avatar ---- */
.avatar {
  width: 40px; height: 40px; flex: none; display: grid; place-items: center;
  border-radius: 50%; background: var(--av, var(--accent)); color: var(--on-accent);
  font-size: 14px; font-weight: 600; letter-spacing: 0.2px; user-select: none;
}
.avatar.sm { width: 28px; height: 28px; font-size: 11px; }
.avatar.xs { width: 24px; height: 24px; font-size: 10px; }

/* ---- Liste: Kopf ---- */
.list-head { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); border-bottom: 1px solid var(--stroke); }
.head-row { display: flex; align-items: center; gap: var(--sp-2); min-height: 36px; }
.list-heading { min-width: 0; display: flex; flex-direction: column; }
.list-title { font-size: var(--fs-subtitle); line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-count { color: var(--fg-tertiary); font-size: var(--fs-caption); line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.selection-bar { display: flex; align-items: center; gap: 2px; min-height: 36px; overflow-x: auto; scrollbar-width: none; }
.selection-count { margin: 0 var(--sp-2); font-weight: 600; white-space: nowrap; }

.search { display: flex; align-items: center; gap: var(--sp-2); height: 34px; padding: 0 var(--sp-1) 0 var(--sp-3); background: var(--bg-panel); border: 1px solid var(--control-border); border-radius: var(--r-control); }
.search:focus-within { border-color: var(--accent); }
.search .icon { color: var(--fg-tertiary); }
.search-input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; }
.search-input::-webkit-search-cancel-button { display: none; }
.has-filter-dot { position: relative; }
.has-filter-dot::after { content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.adv-panel { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); padding: var(--sp-3); background: var(--bg-app); border: 1px solid var(--stroke); border-radius: var(--r-card); }
.adv-wide { grid-column: 1 / -1; }
.adv-checks { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3) var(--sp-4); }
.check-line { display: inline-flex; align-items: center; gap: var(--sp-2); cursor: pointer; }
.check-line input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

.chips { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; }
.chip {
  flex: none; height: 28px; padding: 0 var(--sp-3); border: 1px solid var(--stroke-strong);
  border-radius: 14px; background: transparent; color: var(--fg-secondary);
  transition: background var(--t-fast) var(--ease);
}
.chip:hover { background: var(--bg-card); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* ---- Liste: Einträge ---- */
.list-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.group-title {
  position: sticky; top: 0; z-index: 3; padding: var(--sp-2) var(--sp-4) var(--sp-1);
  background: var(--bg-panel); color: var(--fg-tertiary); font-size: var(--fs-caption); font-weight: 600;
}
.mail-row { position: relative; overflow: hidden; border-bottom: 1px solid var(--stroke); }
.swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--sp-6); color: var(--on-accent); }
.mail-row[data-swipe="right"] .swipe-bg { background: var(--accent); }
.mail-row[data-swipe="left"] .swipe-bg { background: var(--danger); }
.mail-row[data-swipe="right"] .swipe-bg .icon:last-child, .mail-row[data-swipe="left"] .swipe-bg .icon:first-child,
.mail-row:not([data-swipe]) .swipe-bg .icon { visibility: hidden; }

.mail-item {
  position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--sp-3);
  padding: var(--row-pad-y) var(--sp-4) var(--row-pad-y) var(--sp-5);
  background: var(--bg-panel); touch-action: pan-y; cursor: default;

.space-tabs { display: flex; gap: 2px; padding: 0 var(--sp-1) var(--sp-2); border-bottom: 1px solid var(--stroke); }
.space-tab {
  position: relative; flex: 1; display: grid; place-items: center; height: 36px; padding: 0; border: 0;
  border-radius: var(--r-control); background: transparent; color: var(--fg-tertiary);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.space-tab:hover { background: var(--bg-card); color: var(--fg-primary); }
.space-tab[aria-current="page"] { background: var(--bg-active); color: var(--fg-primary); box-shadow: inset 0 -2px 0 var(--accent); }
.space-tab .space-badge { position: absolute; top: 2px; right: 4px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 600; line-height: 14px; text-align: center; }
.app.rail .space-tabs { flex-direction: column; align-items: stretch; }
.app.rail .sp-extra { display: none; }
.sp-head-actions { display: flex; align-items: center; gap: var(--sp-2); }
.space-view .sp-main { flex: 1; min-width: 0; }
@media (max-width: 1099px) {
  .space-view[data-kind="calendar"] .list-pane, .space-view[data-kind="calendar"] .resizer { display: none; }
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); padding-bottom: var(--sp-2); }
.form-wide { grid-column: 1 / -1; }
.pick-list { max-height: 260px; overflow-y: auto; padding: var(--sp-1); border: 1px solid var(--stroke-strong); border-radius: var(--r-control); }
.pick-row { display: flex; width: 100%; padding: var(--sp-1) var(--sp-2); border-radius: var(--r-control); }
.pick-row:hover { background: var(--bg-card); }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--sp-3); }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-4);
  border: 1px solid var(--stroke-strong); border-radius: var(--r-card); background: var(--bg-panel); text-align: left;
}
.tile:hover { background: var(--bg-card); }
.tile .icon { width: 24px; height: 24px; color: var(--accent-text); }
.tile-title { font-weight: 600; }
.tile-text { color: var(--fg-tertiary); font-size: var(--fs-caption); line-height: 16px; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 6px; background: var(--fog); color: var(--fg-primary); font-size: var(--fs-caption); white-space: nowrap; }
.badge--clay { background: var(--clay); color: var(--on-clay); }
.badge--sage { background: var(--sage); color: var(--on-sage); }
.link-btn { padding: 0; border: 0; background: none; color: var(--accent-text); text-align: left; text-decoration: underline; text-underline-offset: 2px; }
.empty-hint { padding: var(--sp-5); color: var(--fg-tertiary); text-align: center; }
.compose-opts { display: flex; flex-wrap: wrap; gap: var(--sp-1); min-width: 0; }
.compose-opts:empty { display: none; }
.cmd-back { display: none; }

/* Adressbuch */
.contact-item { display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-2) var(--sp-4); border: 0; border-bottom: 1px solid var(--stroke); background: var(--bg-panel); text-align: left; }
.contact-item:hover { background: var(--bg-card); }
.contact-item[aria-current="true"] { background: var(--bg-active); }
.contact-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.contact-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.contact-hero { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-5); }
.avatar.xl { width: 72px; height: 72px; font-size: 24px; }
.prop-list { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--sp-3) var(--sp-4); margin: 0; }
.prop-list dt { color: var(--fg-tertiary); }
.prop-list dd { margin: 0; overflow-wrap: anywhere; }
.member-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: 1px solid var(--stroke); }

/* Kalender */
.cal-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); padding: var(--sp-3); border-bottom: 1px solid var(--stroke); }
.cal-title { margin: 0 var(--sp-2); font: 600 var(--fs-subtitle) / 28px var(--font-display); letter-spacing: -0.02em; }
.cal-dow, .cal-month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-dow > span { padding: var(--sp-2); color: var(--fg-tertiary); font-size: var(--fs-caption); font-weight: 600; border-bottom: 1px solid var(--stroke); }
.cal-month { flex: 1; min-height: 0; grid-auto-rows: minmax(0, 1fr); }
.cal-cell { min-height: 0; padding: 4px; border-right: 1px solid var(--stroke); border-bottom: 1px solid var(--stroke); overflow: hidden; background: var(--bg-panel); cursor: pointer; }
.cal-cell:hover { background: var(--bg-card); }
.cal-cell.is-other { background: var(--bg-app); }
.cal-daynum { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 4px; border: 0; border-radius: 12px; background: transparent; font-size: var(--fs-caption); }
.cal-daynum:hover { background: var(--bg-active); }
.cal-cell.is-today .cal-daynum { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.cal-ev {
  display: flex; align-items: center; gap: 4px; width: 100%; margin-top: 2px; padding: 1px 4px; border: 0; border-radius: 4px;
  background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--fg-primary); font-size: var(--fs-caption); line-height: 18px; text-align: left;
}
.cal-ev .dot { width: 6px; height: 6px; margin: 0; background: var(--c); }
.cal-ev > span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-ev.is-allday { background: var(--c); color: var(--on-accent); }
.cal-ev:hover { background: color-mix(in srgb, var(--c) 32%, transparent); }
.cal-ev.is-allday:hover { background: color-mix(in srgb, var(--c) 85%, var(--ink)); }
.cal-more { margin-top: 2px; padding: 0 4px; border: 0; background: none; color: var(--fg-tertiary); font-size: var(--fs-caption); }
.cal-week { flex: 1; min-height: 0; overflow: auto; }
.cal-week-inner { min-width: 560px; }
.cal-cols { display: grid; grid-template-columns: 52px repeat(var(--cols), minmax(0, 1fr)); }
.cal-head { position: sticky; top: 0; z-index: 3; background: var(--bg-panel); border-bottom: 1px solid var(--stroke); }
.cal-head-cell { padding: var(--sp-2); border-left: 1px solid var(--stroke); text-align: center; font-size: var(--fs-caption); }
.cal-head-cell button { margin: 2px auto 0; display: grid; place-items: center; min-width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; font-size: 16px; font-weight: 600; }
.cal-head-cell.is-today button { background: var(--accent); color: var(--on-accent); }
.cal-allday { padding: 0 2px 4px; border-left: 1px solid var(--stroke); }
.cal-grid { --hh: 48px; position: relative; height: calc(24 * var(--hh)); }
.cal-hours { position: relative; }
.cal-hour { position: absolute; right: 8px; color: var(--fg-tertiary); font-size: 11px; transform: translateY(-50%); }
.cal-col { position: relative; border-left: 1px solid var(--stroke); background-image: linear-gradient(var(--stroke) 1px, transparent 1px); background-size: 100% var(--hh); cursor: pointer; }
.cal-block {
  position: absolute; padding: 2px 6px; border: 0; border-left: 3px solid var(--c); border-radius: 6px;
  background: color-mix(in srgb, var(--c) 20%, var(--surface)); color: var(--fg-primary); font-size: var(--fs-caption); line-height: 16px; text-align: left; overflow: hidden;
}
.cal-block:hover { background: color-mix(in srgb, var(--c) 32%, var(--surface)); }
.cal-block strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-now { position: absolute; left: 0; right: 0; z-index: 2; height: 2px; background: var(--clay-mark); pointer-events: none; }
.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 var(--sp-3) var(--sp-3); text-align: center; font-size: var(--fs-caption); }
.mini-dow { padding: 4px 0; color: var(--fg-tertiary); }
.mini-day { height: 28px; padding: 0; border: 0; border-radius: 14px; background: transparent; color: var(--fg-primary); }
.mini-day:hover { background: var(--bg-card); }
.mini-day.is-other { color: var(--fg-tertiary); }
.mini-day.is-sel { background: var(--bg-active); font-weight: 600; }
.mini-day.is-today { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.mini-head { display: flex; align-items: center; gap: var(--sp-1); padding: var(--sp-2) var(--sp-3); font-weight: 600; }
.cal-check { display: flex; align-items: center; gap: var(--sp-2); width: 100%; padding: 0 var(--sp-2) 0 var(--sp-3); min-height: 36px; border-radius: var(--r-control); }
.cal-check:hover { background: var(--bg-card); }
.cal-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--c, var(--accent)); }
.cal-check label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }

/* Aufgaben */
.quick-add { display: flex; gap: var(--sp-2); padding: var(--sp-3); border-bottom: 1px solid var(--stroke); }
.task-row { display: flex; align-items: flex-start; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--stroke); background: var(--bg-panel); }
.task-row:hover { background: var(--bg-card); }
.task-row .check { width: 28px; height: 28px; flex: none; }
.task-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.task-title { overflow-wrap: anywhere; }
.task-row.is-done .task-title { color: var(--fg-tertiary); text-decoration: line-through; }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); color: var(--fg-tertiary); font-size: var(--fs-caption); }

/* Chat */
.chat-pane { display: flex; flex-direction: column; }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: var(--sp-4) var(--sp-5); }
.chat-msg { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--sp-3); padding: 2px 0; }
.chat-msg.is-first { margin-top: var(--sp-3); }
.chat-line { display: flex; align-items: baseline; gap: var(--sp-2); }
.chat-line strong { font-weight: 600; }
.chat-time { color: var(--fg-tertiary); font-size: var(--fs-caption); }
.chat-text { overflow-wrap: anywhere; white-space: pre-wrap; }
.chat-system { align-self: center; margin: var(--sp-3) 0; color: var(--fg-tertiary); font-size: var(--fs-caption); }
.chat-compose { display: flex; align-items: flex-end; gap: var(--sp-2); padding: var(--sp-3); border-top: 1px solid var(--stroke); }
.chat-compose textarea { flex: 1; min-height: 40px; max-height: 140px; padding: 9px var(--sp-3); resize: none; line-height: 20px; }
.presence { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--pc, var(--control-border)); }
.chat-topic { color: var(--fg-tertiary); font-size: var(--fs-caption); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Werkzeug-Dialoge */
.dialog--wide .dialog-body { min-height: 0; }
.dialog--settings { width: min(920px, 100%); height: min(660px, calc(100vh - 32px)); }
.dialog--settings .dialog-body { flex: 1; min-height: 0; display: flex; padding-bottom: var(--sp-5); overflow: hidden; }
.settings-split { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: var(--sp-5); }
.settings-nav { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: var(--sp-2); border-right: 1px solid var(--stroke); }
.settings-nav .nav-section { margin-top: var(--sp-4); padding-left: var(--sp-2); }
.settings-nav .nav-section:first-child { margin-top: 0; }
.settings-nav .btn { justify-content: flex-start; min-height: 34px; }
.settings-nav .btn[aria-current="true"] { background: var(--bg-active); color: var(--fg-primary); font-weight: 600; box-shadow: inset 3px 0 0 var(--accent); }
.settings-panel { min-height: 0; overflow-y: auto; padding-right: var(--sp-2); }
.settings-panel > .btn { margin-top: var(--sp-2); }
.set-heading { margin: 0 0 var(--sp-4); font: 600 var(--fs-subtitle) / 28px var(--font-display); letter-spacing: -0.02em; }
.settings-select { display: none; margin-bottom: var(--sp-3); }
.split { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--sp-4); }
.split-nav { display: flex; flex-direction: column; gap: 2px; }
.split-nav .btn { justify-content: flex-start; }
.split-nav .btn[aria-current="true"] { background: var(--bg-active); font-weight: 600; }
.rule-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-2); }
.row-card { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); border: 1px solid var(--stroke); border-radius: var(--r-card); margin-bottom: var(--sp-2); }
.row-card-main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.row-card-main .set-hint { margin: 0; }
.theme-card { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-3); border: 1px solid var(--stroke-strong); border-radius: var(--r-card); background: var(--bg-panel); text-align: left; }
.theme-card[aria-checked="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.theme-swatch { display: flex; height: 56px; overflow: hidden; border-radius: var(--r-control); border: 1px solid var(--stroke); }
.theme-swatch i { flex: 1; }
.drop-zone { display: grid; place-items: center; gap: var(--sp-2); padding: var(--sp-6); border: 2px dashed var(--control-border); border-radius: var(--r-card); color: var(--fg-tertiary); text-align: center; }

@media (max-width: 719px) {
  .dialog--settings { height: calc(100vh - 32px); }
  .settings-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .settings-nav { display: none; }
  .settings-select { display: block; }
  .form-grid, .split { grid-template-columns: 1fr; }
  .rule-row { grid-template-columns: 1fr 1fr; }
  .prop-list { grid-template-columns: 1fr; gap: 2px var(--sp-4); }
  .prop-list dd { margin-bottom: var(--sp-3); }
}

/* ==========================================================================
   5. ANIMATION & AUSGABE
   ========================================================================== */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.compose.is-max { animation-name: fade; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

@media print {
  body { overflow: visible; background: none; }
  .space-view, .sidebar, .list-pane, .resizer, .cmdbar, .quick-reply, .msg-tools, .skip-link, .scrim, .toast-host, #compose-host, #layer { display: none !important; }
  .app, .content { display: block; height: auto; padding: 0; background: none; }
  .content[data-overlay="true"] .reader-pane, .reader-pane {
    position: static; width: auto; transform: none; visibility: visible; border: 0; box-shadow: none; background: none; overflow: visible;
  }
  .reader-scroll { overflow: visible; padding: 0; }
  .msg { background: none; border-color: #999999; }
  * { color: #1F1F1F !important; background: transparent !important; }
}
</style>

<body>
<a class="skip-link" href="#message-list">Zur Nachrichtenliste springen</a>

<div class="app" id="app">
  <!-- Linke Navigation -->
  <aside class="sidebar" id="sidebar" aria-label="Postfach">
    <div class="sidebar-top">
      <button class="btn btn--icon reveal" id="btn-collapse" type="button" data-action="collapse" data-icon="menu" aria-label="Navigation ein- oder ausklappen" title="Navigation ein- oder ausklappen"></button>
      <span class="brand">Mail</span>
    </div>
    <button class="btn btn--accent compose-btn" id="btn-compose" type="button" data-action="compose-new" data-icon="edit" title="Neue Nachricht (C)">
      <span class="btn-text">Neue Nachricht</span>
    </button>
    <nav class="nav" id="nav" aria-label="Ordner und Kategorien"></nav>
    <div class="sidebar-bottom">
      <button class="btn account-btn reveal" id="btn-account" type="button" data-action="account-menu" aria-haspopup="menu" title="Konto wechseln"></button>
      <button class="btn btn--icon reveal" id="btn-settings" type="button" data-action="settings" data-icon="sliders" aria-label="Einstellungen" title="Einstellungen"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-action="close-drawer"></div>

  <main class="content" id="content" data-pane="right" data-overlay="false" data-open="false">

    <section class="list-pane" id="list-pane" aria-labelledby="list-title">
      <header class="list-head">
        <div class="head-row" id="head-default">
          <button class="btn btn--icon only-narrow" type="button" data-action="drawer" data-icon="menu" aria-label="Navigation öffnen" title="Navigation öffnen"></button>
          <div class="list-heading">
            <h1 class="list-title" id="list-title">Posteingang</h1>
            <span class="list-count" id="list-count"></span>
          </div>
          <span class="spacer"></span>
          <button class="btn" id="btn-empty-trash" type="button" data-action="empty-trash" hidden>Papierkorb leeren</button>
          <button class="btn btn--icon" id="btn-view" type="button" data-action="view-menu" data-icon="sort" aria-haspopup="menu" aria-label="Sortierung und Ansicht" title="Sortierung und Ansicht"></button>
        </div>

          <button class="btn btn--icon btn--sm" id="btn-clear-search" type="button" data-action="clear-search" data-icon="close" aria-label="Suche löschen" title="Suche löschen" hidden></button>
          <button class="btn btn--icon btn--sm" id="btn-adv" type="button" data-action="toggle-adv" data-icon="filter" aria-expanded="false" aria-controls="adv-panel" aria-label="Erweiterte Filter" title="Erweiterte Filter"></button>
        </form>

            <input class="input" id="adv-from" type="text" data-adv="from" autocomplete="off">
          </div>
          <div>
            <label class="field-label" for="adv-subject">Betreff</label>
            <input class="input" id="adv-subject" type="text" data-adv="subject" autocomplete="off">
          </div>
          <div>
            <label class="field-label" for="adv-after">Ab Datum</label>
            <input class="input" id="adv-after" type="date" data-adv="after">
          </div>
          <div>
            <label class="field-label" for="adv-before">Bis Datum</label>
            <input class="input" id="adv-before" type="date" data-adv="before">
          </div>

          <button class="chip" type="button" data-action="chip" data-chip="unread" aria-pressed="false">Ungelesen</button>

        </div>
      </header>
      <div class="list-scroll" id="list-scroll">

        <div class="list-empty" id="list-empty" hidden>

<script>
'use strict';

/* ==========================================================================
   6. HILFSFUNKTIONEN
   ========================================================================== */
const SVG_NS = 'http://www.w3.org/2000/svg';
const DAY = 864e5;

/** Baut DOM-Elemente. Texte werden ausschließlich als Textknoten eingefügt (XSS-sicher). */
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'dataset') {
      for (const [name, val] of Object.entries(value)) if (val !== null && val !== undefined) el.dataset[name] = val;
    } else if (key === 'on') {
      for (const [type, fn] of Object.entries(value)) el.addEventListener(type, fn);
    } else if (key === 'value') el.value = value;
    else el.setAttribute(key, value === true ? '' : value);
  }
  el.append(...children.flat(Infinity).filter(child => child !== null && child !== undefined && child !== false));
  return el;
}

function initialsOf(name) {
  const base = name.includes('@') ? name.split('@')[0] : name;
  const parts = base.split(/[\s._-]+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}

function avatarColor(seed) {
  let hash = 0;
  for (const ch of seed.toLowerCase()) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

/* ---- Datum & Größen ---- */
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const fmtClock = ts => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const fmtLong = ts => new Date(ts).toLocaleString('de-DE', { dateStyle: 'full', timeStyle: 'short' });

function fmtListTime(ts) {
  const today = startOfDay(Date.now());
  if (ts >= today) return fmtClock(ts);
  if (ts >= today - DAY) return 'Gestern';
  if (ts >= today - 6 * DAY) return new Date(ts).toLocaleDateString('de-DE', { weekday: 'short' });
  return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

function dateGroup(ts) {
  const today = startOfDay(Date.now());
  if (ts >= today) return 'Heute';
  if (ts >= today - DAY) return 'Gestern';
  if (ts >= today - 6 * DAY) return 'Diese Woche';
  return 'Älter';
}

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1048576) return `${Math.round(bytes / 1024)} KB`;
  return `${(bytes / 1048576).toFixed(1).replace('.', ',')} MB`;
}

const withPrefix = (subject, prefix, pattern) => (pattern.test(subject) ? subject : `${prefix} ${subject}`);

const textCache = new Map();
function plainText(html) {
  let text = textCache.get(html);
  if (text === undefined) {
    const spaced = html.replace(/<\/(?:p|div|li|h[1-6]|tr|blockquote|pre)>|<br\s*\/?>/gi, ' ');
    text = new DOMParser().parseFromString(spaced, 'text/html').body.textContent.replace(/\s+/g, ' ').trim();
    if (textCache.size > 400) textCache.clear();
    textCache.set(html, text);
  }
  return text;
}

/** Zerlegt Text in Textknoten und <mark>-Elemente für die Trefferhervorhebung. */
function highlight(text, tokens) {
  if (!tokens.length || !text) return text;
  const re = new RegExp(`(${tokens.map(escapeRe).join('|')})`, 'gi');
  return text.split(re).map((part, i) => (i % 2 ? h('mark', {}, part) : part));
}

function markTextNodes(root, tokens) {
  if (!tokens.length) return;
  const test = new RegExp(tokens.map(escapeRe).join('|'), 'i');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) if (test.test(node.nodeValue)) node.replaceWith(...[highlight(node.nodeValue, tokens)].flat());
}

/* ---- HTML-Sanitizer (Whitelist) ---- */
const ALLOWED_TAGS = new Set(['P', 'BR', 'DIV', 'SPAN', 'B', 'STRONG', 'I', 'EM', 'U', 'S', 'UL', 'OL', 'LI', 'A', 'BLOCKQUOTE', 'H1', 'H2', 'H3', 'H4', 'HR', 'PRE', 'CODE', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'SMALL', 'SUB', 'SUP']);
const DROPPED_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'NOSCRIPT', 'TEMPLATE', 'SVG', 'MATH', 'HEAD', 'TITLE', 'FORM', 'INPUT', 'BUTTON', 'TEXTAREA', 'SELECT', 'LINK', 'META', 'IMG', 'VIDEO', 'AUDIO']);

function safeHref(value) {
  const href = (value || '').trim();
  return /^(?:https?:\/\/|mailto:)/i.test(href) ? href : '';
}

function sanitizeInto(target, source) {
  for (const node of source.childNodes) {
    if (node.nodeType === Node.TEXT_NODE) {
      target.append(document.createTextNode(node.nodeValue));
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      const tag = node.tagName.toUpperCase();
      if (DROPPED_TAGS.has(tag)) continue;
      if (!ALLOWED_TAGS.has(tag)) { sanitizeInto(target, node); continue; }
      const el = document.createElement(tag.toLowerCase());
      if (tag === 'A') {
        const href = safeHref(node.getAttribute('href'));
        if (href) { el.setAttribute('href', href); el.setAttribute('target', '_blank'); el.setAttribute('rel', 'noopener noreferrer'); }
      }
      if (tag === 'TD' || tag === 'TH') {
        for (const attr of ['colspan', 'rowspan']) if (/^\d{1,2}$/.test(node.getAttribute(attr) || '')) el.setAttribute(attr, node.getAttribute(attr));
      }
      sanitizeInto(el, node);
      target.append(el);
    }
  }
}

function sanitizeHTML(html) {
  const doc = new DOMParser().parseFromString(String(html), 'text/html');
  const fragment = document.createDocumentFragment();
  sanitizeInto(fragment, doc.body);
  return fragment;
}

function sanitizeToString(html) {
  const box = document.createElement('div');
  box.append(sanitizeHTML(html));
  return box.innerHTML;
}

/** Wandelt reinen Text in Absätze um. */
function textToParagraphs(text) {
  const box = document.createElement('div');
  for (const line of text.split(/\r?\n/)) box.append(h('p', {}, line || h('br')));
  return box;
}

/** Beschädigte Rohdaten unter `<key>.defekt.<ms>` sichern (nie ein älteres Backup überschreiben, höchstens 3 behalten). Gibt den Schlüssel zurück (null, wenn nichts gesichert wurde). */
function backupDefekt(raw) {
  if (raw == null) return null;
  const prefix = `${STORAGE_KEY}.defekt.`;
  try {
    const stamps = [];
    for (let i = 0; i < localStorage.length; i += 1) {
      const key = localStorage.key(i);
      if (key && key.startsWith(prefix) && /^\d+$/.test(key.slice(prefix.length))) stamps.push(Number(key.slice(prefix.length)));
    }
    stamps.sort((x, y) => x - y);
    const stamp = Math.max(Date.now(), (stamps.at(-1) ?? 0) + 1);
    localStorage.setItem(prefix + stamp, raw);
    stamps.push(stamp);
    while (stamps.length > BACKUP_MAX) localStorage.removeItem(prefix + stamps.shift());
    return prefix + stamp;
  } catch { return null; /* Speicher voll oder gesperrt: Sicherung entfällt */ }
}

const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
const isStr = v => typeof v === 'string';
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const isPerson = p => isObj(p) && isStr(p.email) && p.email.includes('@');

/**
 * Prüft einen gespeicherten Zustand strukturell und bereinigt ihn.
 * Gibt { state, dropped } zurück (dropped = Anzahl verworfener Einträge/Sammlungen)
 * oder null, wenn der Zustand insgesamt unbrauchbar ist.
 */
function sanitizeState(saved) {
  if (!isObj(saved) || !Array.isArray(saved.mails) || !Array.isArray(saved.accounts)) return null;
  let dropped = 0;
  // Sammlung auf gültige Einträge reduzieren; Verworfenes wird gezählt.
  const keep = (list, ok, fix = x => x) => {
    const out = [];
    for (const item of list) { if (ok(item)) out.push(fix(item)); else dropped += 1; }
    return out;
  };
  const accounts = keep(saved.accounts, a => isObj(a) && isStr(a.id) && isStr(a.email) && a.email.includes('@'), a => ({
    ...a, name: isStr(a.name) ? a.name : a.email, label: isStr(a.label) ? a.label : a.email, signature: isStr(a.signature) ? a.signature : '',
    ooo: { enabled: false, subject: '', message: '', ...(isObj(a.ooo) ? a.ooo : {}) },
  }));
  if (!accounts.length) return null;
  const accountIds = new Set(accounts.map(a => a.id));
  const labels = Array.isArray(saved.labels) ? keep(saved.labels, l => isObj(l) && isStr(l.id) && isStr(l.name), l => ({ ...l, color: isStr(l.color) ? l.color : 'var(--ink-muted)' })) : [];
  const folders = Array.isArray(saved.folders) ? keep(saved.folders, f => isObj(f) && isStr(f.id) && isStr(f.name) && accountIds.has(f.account)) : [];
  const labelIds = new Set(labels.map(l => l.id));
  const mails = keep(saved.mails, m => isObj(m) && isStr(m.id) && accountIds.has(m.account) && isStr(m.folder) && isPerson(m.from)
    && isStr(m.subject) && isStr(m.body) && isNum(m.date), m => {
    // Stille Korrekturen zählen mit, damit der Hinweis erscheint.
    const people = list => {
      if (!Array.isArray(list)) return [];
      const ok = list.filter(isPerson);
      dropped += list.length - ok.length;
      return ok.map(p => ({ ...p, name: isStr(p.name) ? p.name : '' }));
    };
    const labelList = Array.isArray(m.labels) ? m.labels.filter(id => isStr(id) && labelIds.has(id)) : [];
    if (Array.isArray(m.labels)) dropped += m.labels.length - labelList.length;
    const attList = Array.isArray(m.attachments) ? m.attachments.filter(a => isObj(a) && isStr(a.id) && isStr(a.name)) : [];
    if (Array.isArray(m.attachments)) dropped += m.attachments.length - attList.length;
    // Verwaiste Ordner: Nachricht in den Posteingang des Kontos verschieben, statt sie unsichtbar zu lassen.
    const folderOk = SYSTEM_FOLDERS.some(f => f.id === m.folder) || folders.some(f => f.id === m.folder && f.account === m.account);
    if (!folderOk) dropped += 1;
    return {
      ...m, folder: folderOk ? m.folder : 'inbox', from: { ...m.from, name: isStr(m.from.name) ? m.from.name : '' },
      to: people(m.to), cc: people(m.cc), bcc: people(m.bcc),
      read: m.read !== false, starred: m.starred === true,
      labels: labelList,
      attachments: attList.map(a => ({ ...a, size: isNum(a.size) ? a.size : 0, type: isStr(a.type) ? a.type : fileKind(a.name) })),
    };
  });
  const contacts = Array.isArray(saved.contacts) ? keep(saved.contacts, c => isObj(c), c => ({ ...c, name: isStr(c.name) ? c.name : '', email: isStr(c.email) ? c.email : '' })) : [];
  const view = isObj(saved.view) ? saved.view : {};
  const result = {
    ...saved, accounts, labels, folders, mails, contacts,
    activeAccount: accountIds.has(saved.activeAccount) ? saved.activeAccount : accounts[0].id,
    settings: { ...defaultSettings(), ...(isObj(saved.settings) ? saved.settings : {}) },
    view: { ...view, folder: 'inbox', sort: 'date', sortDir: 'desc', chip: 'all', ...Object.fromEntries(Object.entries(view).filter(([, v]) => isStr(v))) },
  };
  // Optionale Sammlungen (Adressbuch, Kalender, Chat …): bei falscher Form entfernen, ensureExtras() ergänzt Startwerte.
  const drop = key => { if (key in result) { delete result[key]; dropped += 1; } };
  const arr = (key, ok) => {
    if (!(key in result)) return true;
    if (!Array.isArray(result[key])) { drop(key); return false; }
    result[key] = keep(result[key], ok);
    return true;
  };
  const hasId = x => isObj(x) && isStr(x.id);
  if (!arr('people', p => hasId(p) && isStr(p.name) && isStr(p.email)) || !arr('books', b => hasId(b) && isStr(b.name))
    || !arr('lists', l => hasId(l) && isStr(l.name) && Array.isArray(l.members))) { drop('people'); drop('books'); drop('lists'); }
  if (!arr('calendars', c => hasId(c) && isStr(c.name)) || !arr('events', e => hasId(e) && isStr(e.cal) && isStr(e.title) && isNum(e.start) && isNum(e.end))
    || !arr('tasks', t => hasId(t) && isStr(t.cal) && isStr(t.title))) { drop('calendars'); drop('events'); drop('tasks'); }
  if ('people' in result && !('books' in result && 'lists' in result)) { drop('people'); drop('books'); drop('lists'); }
  if ('calendars' in result && !('events' in result && 'tasks' in result)) { drop('calendars'); drop('events'); drop('tasks'); }
  const chat = result.chat;
  if ('chat' in result && !(isObj(chat) && Array.isArray(chat.accounts) && Array.isArray(chat.rooms) && chat.rooms.every(r => hasId(r) && Array.isArray(r.messages) && Array.isArray(r.members)))) drop('chat');
  arr('savedSearches', s => hasId(s) && isStr(s.name) && isObj(s.adv));
  arr('filters', f => hasId(f) && isStr(f.name) && Array.isArray(f.rules) && Array.isArray(f.actions));
  arr('addons', a => hasId(a) && isStr(a.name) && isStr(a.kind));
  arr('activities', a => hasId(a) && isStr(a.text));
  return { state: result, dropped };
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch { /* Speicher gesperrt: Startdaten */ }
  loadedRaw = raw;
  if (raw !== null) {
    try {
      const checked = sanitizeState(JSON.parse(raw));
      if (checked) {
        if (checked.dropped) {
          const key = backupDefekt(raw);
          loadedBackedUp = true;
          loadNotice = `Gespeicherte Daten waren teilweise beschädigt (${checked.dropped} ungültige Einträge entfernt oder korrigiert).${key ? ` Eine Sicherung liegt unter „${key}“.` : ''}`;
        }
        return checked.state;
      }
    } catch { /* Kein gültiges JSON: Startdaten */ }
    const key = backupDefekt(raw);
    loadedBackedUp = true;
    loadNotice = `Gespeicherte Daten waren beschädigt und wurden durch Startdaten ersetzt.${key ? ` Eine Sicherung liegt unter „${key}“.` : ''}`;
  }
  const fresh = seedState();
  persist(fresh);
  return fresh;
}

function persist(data = state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch { /* Speicher voll oder gesperrt: App läuft im Arbeitsspeicher weiter */ }
}

function defaultSettings() {
  return { density: 'normal', pane: 'right', notifications: false, conversations: true, sidebarCollapsed: window.innerWidth < 1100, listWidth: 380, listHeight: 340 };
}

/** Anwendungszustand; wird nach den Hilfsfunktionen oben geladen (Prüfung, Startdaten). */
let state = loadState();

const activeAccount = () => state.accounts.find(a => a.id === state.activeAccount);
const accountById = id => state.accounts.find(a => a.id === id);
const findMail = id => state.mails.find(m => m.id === id);
const ownEmails = () => new Set(state.accounts.map(a => a.email.toLowerCase()));
const isOwn = person => ownEmails().has(person.email.toLowerCase());
const customFolders = () => state.folders.filter(f => f.account === state.activeAccount);
const labelById = id => state.labels.find(l => l.id === id);

function folderName(view) {
  const system = SYSTEM_FOLDERS.find(f => f.id === view);
  if (system) return system.name;
  if (view.startsWith('label:')) return labelById(view.slice(6))?.name ?? 'Kategorie';
  if (view.startsWith('search:')) return state.savedSearches?.find(s => s.id === view.slice(7))?.name ?? 'Suche';
  return state.folders.find(f => f.id === view)?.name ?? 'Ordner';
}

function viewExists(view) {
  if (SYSTEM_FOLDERS.some(f => f.id === view)) return true;
  if (view.startsWith('label:')) return Boolean(labelById(view.slice(6)));
  if (view.startsWith('search:')) return Boolean(state.savedSearches?.some(s => s.id === view.slice(7)));
  return customFolders().some(f => f.id === view);
}

/* ==========================================================================
   10. ABGELEITETE DATEN (Filter, Suche, Konversationen, Sortierung)
   ========================================================================== */
const HIDDEN_FROM_THREADS = ['trash', 'spam', 'drafts', 'outbox'];

const isOverlay = () => mqOverlay.matches || state.settings.pane === 'off';
const searchTokens = () => ui.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
const searchActive = () => {
  const a = ui.adv;
  return searchTokens().length > 0 || Boolean(a.from.trim() || a.subject.trim() || a.after || a.before || a.attach);
};
const searchesAllFolders = () => ui.adv.all && searchActive();

function inView(mail, view) {
  if (view.startsWith('search:')) return mail.folder !== 'trash' && mail.folder !== 'spam';
  if (view === 'unified') return mail.folder === 'inbox';
  if (view === 'starred') return mail.starred && mail.folder !== 'trash' && mail.folder !== 'spam';
  if (view.startsWith('label:')) return mail.labels.includes(view.slice(6)) && mail.folder !== 'trash' && mail.folder !== 'spam';
  return mail.folder === view;
}

/** Durchsuchte Felder laut Quick-Filter („Suchen in“): Absender, Empfänger, Betreff, Text. */
function haystack(mail) {
  const scope = ui.adv;
  const parts = [];
  if (scope.sFrom) parts.push(mail.from.name, mail.from.email);
  if (scope.sTo) parts.push(...mail.to.flatMap(r => [r.name, r.email]));
  if (scope.sSubject) parts.push(mail.subject);
  if (scope.sBody) parts.push(plainText(mail.body));
  return parts.join(' ').toLowerCase();
}

function matchesFilters(mail, tokens) {
  const { chip } = state.view;
  const adv = ui.adv;
  if (chip === 'unread' && mail.read) return false;
  if (chip === 'starred' && !mail.starred) return false;
  if (chip === 'attach' && !mail.attachments.length) return false;
  if (chip === 'contact' && !state.contacts.some(c => c.email.toLowerCase() === mail.from.email.toLowerCase())) return false;
  if (chip === 'tagged' && !mail.labels.length) return false;
  if (adv.attach && !mail.attachments.length) return false;
  const from = adv.from.trim().toLowerCase();
  if (from && !`${mail.from.name} ${mail.from.email}`.toLowerCase().includes(from)) return false;
  const subject = adv.subject.trim().toLowerCase();
  if (subject && !mail.subject.toLowerCase().includes(subject)) return false;
  if (adv.after && mail.date < new Date(`${adv.after}T00:00:00`).getTime()) return false;
  if (adv.before && mail.date >= new Date(`${adv.before}T00:00:00`).getTime() + DAY) return false;
  if (tokens.length) {
    const text = haystack(mail);
    if (!tokens.every(token => text.includes(token))) return false;
  }
  return true;
}

function makeConv(key, mails, total) {
  return {
    key, mails, rep: mails[0], total,
    unread: mails.some(m => !m.read),
    starred: mails.some(m => m.starred),
    hasAttach: mails.some(m => m.attachments.length > 0),
    labels: [...new Set(mails.flatMap(m => m.labels))],
  };
}

function buildConvs(viewMails, threads) {
  if (!state.settings.conversations) return viewMails.map(m => makeConv(m.id, [m], 1));
  const groups = new Map();
  for (const mail of viewMails) {
    const key = threadKey(mail.subject);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(mail);
  }
  return [...groups.entries()].map(([key, mails]) => {
    mails.sort((a, b) => b.date - a.date);
    const total = HIDDEN_FROM_THREADS.includes(mails[0].folder) ? mails.length : Math.max(mails.length, threads.get(key)?.length ?? 0);
    return makeConv(key, mails, total);
  });
}

const peerOf = conv => {
  const { rep } = conv;
  if (rep.folder === 'sent' || rep.folder === 'drafts' || rep.folder === 'outbox') return rep.to.map(personLabel).join(', ') || '(Kein Empfänger)';
  return personLabel(rep.from);
};

function sortConvs(convs) {
  const { sort, sortDir } = state.view;
  const dir = sortDir === 'asc' ? 1 : -1;
  convs.sort((a, b) => {
    let result;
    if (sort === 'sender') result = peerOf(a).localeCompare(peerOf(b), 'de');
    else if (sort === 'subject') result = threadKey(a.rep.subject).localeCompare(threadKey(b.rep.subject), 'de');
    else result = a.rep.date - b.rep.date;
    return result * dir || b.rep.date - a.rep.date;
  });
}

function groupConvs(convs) {
  if (state.view.sort !== 'date') return convs.length ? [{ label: '', convs }] : [];
  const groups = [];
  for (const conv of convs) {
    const label = dateGroup(conv.rep.date);
    const last = groups[groups.length - 1];
    if (last && last.label === label) last.convs.push(conv);
    else groups.push({ label, convs: [conv] });
  }
  return groups;
}

function computeDerived() {
  const tokens = searchTokens();
  const own = state.mails.filter(m => m.account === state.activeAccount);
  const all = searchesAllFolders();
  const scope = state.view.folder === 'unified' && !all ? state.mails : own;
  const counts = { unread: {}, labels: {}, drafts: 0 };
  counts.unread.unified = state.mails.filter(m => m.folder === 'inbox' && !m.read).length;
  const threads = new Map();
  for (const mail of own) {
    if (mail.folder === 'drafts') counts.drafts += 1;
    else if (mail.folder === 'outbox') counts.outbox = (counts.outbox || 0) + 1;
    else if (!mail.read) {
      counts.unread[mail.folder] = (counts.unread[mail.folder] || 0) + 1;
      if (mail.folder !== 'trash' && mail.folder !== 'spam') for (const id of mail.labels) counts.labels[id] = (counts.labels[id] || 0) + 1;
    }
  }
  for (const mail of scope) {
    if (!HIDDEN_FROM_THREADS.includes(mail.folder)) {
      const key = threadKey(mail.subject);
      if (!threads.has(key)) threads.set(key, []);
      threads.get(key).push(mail);
    }
  }
  const viewMails = scope.filter(m => (all || inView(m, state.view.folder)) && matchesFilters(m, tokens));
  const convs = buildConvs(viewMails, threads);
  sortConvs(convs);
  return { convs, groups: groupConvs(convs), tokens, counts };
}

const refresh = () => { derived = computeDerived(); };
const convOfMail = id => derived.convs.find(c => c.mails.some(m => m.id === id));
const idsOfConv = id => convOfMail(id)?.mails.map(m => m.id) ?? (findMail(id) ? [id] : []);

function threadMembers(mail) {
  if (!state.settings.conversations || mail.folder === 'drafts') return [mail];
  const key = threadKey(mail.subject);
  const special = mail.folder === 'trash' || mail.folder === 'spam';
  return state.mails
    .filter(m => m.account === mail.account && threadKey(m.subject) === key && (special ? m.folder === mail.folder : !HIDDEN_FROM_THREADS.includes(m.folder)))
    .sort((a, b) => a.date - b.date);
}

/** Rendert einen Container neu und stellt den Fokus anhand von data-fk wieder her. */
function keepFocus(root, build) {
  const active = document.activeElement;
  const key = root.contains(active) ? active.dataset.fk : undefined;
  build();
  if (key) root.querySelector(`[data-fk="${CSS.escape(key)}"]`)?.focus({ preventScroll: true });
}

function render() {
  refresh();
  renderChrome();
  renderSpaces();
  renderSidebar();
  renderSelectionBar();
  renderList();
  renderReader();
  applyFocusRequest();
}

function applyFocusRequest() {
  const request = ui.focusAfterRender;
  ui.focusAfterRender = null;
  if (!request) return;
  if (request === 'reader') $('#reader-title')?.focus();
  else $(`[data-fk="${CSS.escape(request)}"]`)?.focus();
}

function listSummary() {
  const n = derived.convs.length;
  const unread = derived.convs.filter(c => c.unread).length;
  const noun = state.settings.conversations ? plural(n, 'Konversation', 'Konversationen') : plural(n, 'Nachricht', 'Nachrichten');
  return `${n} ${noun}${unread ? ` · ${unread} ungelesen` : ''}`;
}

function renderChrome() {
  const app = $('#app');
  const content = $('#content');
  const overlay = isOverlay();
  const open = Boolean(ui.selectedId);
  const { settings, view } = state;

  app.dataset.density = settings.density;
  app.dataset.drawer = ui.drawerOpen ? 'open' : 'closed';
  app.classList.toggle('rail', settings.sidebarCollapsed);
  content.dataset.pane = settings.pane;
  content.dataset.overlay = String(overlay);
  content.dataset.open = String(open);
  content.style.setProperty('--list-w', `${settings.listWidth}px`);
  content.style.setProperty('--list-h', `${settings.listHeight}px`);
  $('#sidebar').inert = mqNarrow.matches && !ui.drawerOpen;
  $('#list-pane').inert = overlay && open;
  $('#reader').inert = overlay && !open;

  const collapse = $('#btn-collapse');
  collapse.setAttribute('aria-expanded', String(!settings.sidebarCollapsed));
  const resizer = $('#resizer');
  const bottom = settings.pane === 'bottom';
  resizer.setAttribute('aria-orientation', bottom ? 'horizontal' : 'vertical');
  resizer.setAttribute('aria-valuenow', String(bottom ? settings.listHeight : settings.listWidth));

  const title = searchesAllFolders() ? 'Alle Ordner' : folderName(view.folder);
  $('#list-title').textContent = title;
  $('#list-count').textContent = listSummary();
  $('#btn-empty-trash').hidden = view.folder !== 'trash' || !derived.convs.length;
  document.title = `${derived.counts.unread.inbox ? `(${derived.counts.unread.inbox}) ` : ''}${title} – Mail`;

  for (const chip of document.querySelectorAll('.chip')) chip.setAttribute('aria-pressed', String(chip.dataset.chip === view.chip));
  const search = $('#search');
  if (search.value !== ui.query) search.value = ui.query;
  $('#btn-clear-search').hidden = !ui.query;
  const adv = $('#btn-adv');
  adv.setAttribute('aria-expanded', String(ui.advOpen));
  adv.classList.toggle('has-filter-dot', ui.adv.from.trim() !== '' || ui.adv.subject.trim() !== '' || Boolean(ui.adv.after || ui.adv.before || ui.adv.attach || ui.adv.all));
  $('#adv-panel').hidden = !ui.advOpen;
  $('#list-pane').dataset.selecting = String(ui.checked.size > 0);
}

/* ---- Nachrichtenliste ---- */
function snippet(text, tokens, length) {
  if (!text) return '';
  const lower = text.toLowerCase();
  const hits = tokens.map(t => lower.indexOf(t)).filter(i => i >= 0);
  const start = hits.length && Math.min(...hits) > 60 ? Math.min(...hits) - 40 : 0;
  return (start ? '…' : '') + text.slice(start, start + length) + (text.length > start + length ? '…' : '');
}

/* ==========================================================================
   12. OVERLAYS: MENÜS, DIALOGE, TOASTS
   ========================================================================== */
const layer = $('#layer');
const composeHost = $('#compose-host');
const dialogs = [];
let menuState = null;
let toastTimer = 0;

const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

function closeMenu() {
  if (!menuState) return;
  const { el, trigger, cleanup } = menuState;
  menuState = null;
  cleanup();
  el.remove();
  const target = trigger?.isConnected ? trigger : trigger?.dataset?.fk && $(`[data-fk="${CSS.escape(trigger.dataset.fk)}"]`);
  target?.focus({ preventScroll: true });
}

/** Öffnet ein Menü an einem Anker-Element oder einem Punkt. Ein erneuter Klick auf den Anker schließt es wieder. */
function openMenu({ anchor, point, items, label, trigger }) {
  if (menuState && anchor && menuState.anchor === anchor) { closeMenu(); return; }
  const opener = trigger || anchor || document.activeElement;
  closeMenu();

  const menu = h('div', { class: 'menu', role: 'menu', 'aria-label': label, tabindex: '-1' });
  const hasChecks = items.some(item => item.checked !== undefined);
  for (const item of items) {
    if (item.separator) { menu.append(h('div', { class: 'menu-sep', role: 'separator' })); continue; }
    if (item.heading) { menu.append(h('div', { class: 'menu-heading', role: 'presentation' }, item.heading)); continue; }
    const role = item.checked === undefined ? 'menuitem' : item.radio ? 'menuitemradio' : 'menuitemcheckbox';
    menu.append(h('button', {
      class: `menu-item${item.danger ? ' is-danger' : ''}`, type: 'button', role, tabindex: '-1', disabled: item.disabled,
      'aria-checked': item.checked === undefined ? null : String(item.checked),
      on: { click: () => { closeMenu(); item.onSelect(); } },
    },
    hasChecks ? h('span', { class: 'menu-check' }, item.checked ? icon('check') : null) : null,
    item.dot ? h('span', { class: 'dot', style: `--dot:${item.dot}` }) : item.icon ? icon(item.icon) : null,
    h('span', { class: 'menu-label' }, item.label),
    item.shortcut ? h('kbd', {}, item.shortcut) : null));
  }

  menu.style.visibility = 'hidden';
  layer.append(menu);
  const box = menu.getBoundingClientRect();
  let x;
  let y;
  if (anchor) {
    const a = anchor.getBoundingClientRect();
    x = a.left;
    y = a.bottom + 4;
    if (y + box.height > window.innerHeight - 8) y = Math.max(8, a.top - box.height - 4);
  } else {
    ({ x, y } = point);
    if (y + box.height > window.innerHeight - 8) y = Math.max(8, window.innerHeight - box.height - 8);
  }
  x = Math.min(Math.max(8, x), Math.max(8, window.innerWidth - box.width - 8));
  menu.style.left = `${x}px`;
  menu.style.top = `${y}px`;
  menu.style.visibility = '';

  const enabled = () => [...menu.querySelectorAll('.menu-item:not([disabled])')];
  menu.addEventListener('keydown', e => {
    const list = enabled();
    const index = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') list[(index + 1) % list.length].focus();
    else if (e.key === 'ArrowUp') list[(index - 1 + list.length) % list.length].focus();
    else if (e.key === 'Home') list[0].focus();
    else if (e.key === 'End') list[list.length - 1].focus();
    else if (e.key === 'Tab') closeMenu();
    else return;
    e.preventDefault();
  });
  const onOutside = e => { if (!menu.contains(e.target) && !(anchor && anchor.contains(e.target))) closeMenu(); };
  document.addEventListener('pointerdown', onOutside, true);
  window.addEventListener('resize', closeMenu);
  menuState = {
    el: menu, trigger: opener, anchor,
    cleanup: () => { document.removeEventListener('pointerdown', onOutside, true); window.removeEventListener('resize', closeMenu); },
  };
  (enabled()[0] || menu).focus();
}

const syncInert = () => {
  const modal = dialogs.length > 0;
  $('#app').inert = modal;
  composeHost.inert = modal;
};

/** Modaler Dialog mit Fokusfalle. Löst mit dem Wert des gedrückten Buttons auf (null bei Abbruch). */
function showDialog({ title, content, buttons = [], variant = '', closable = false }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const titleId = uid('dialog-title');
    const entry = {};
    const finish = value => {
      overlay.remove();
      dialogs.splice(dialogs.indexOf(entry), 1);
      syncInert();
      if (opener?.isConnected) opener.focus({ preventScroll: true });
      resolve(value);
    };
    entry.close = () => finish(null);

    const footerButtons = buttons.map(b => h('button', {
      class: `btn btn--${b.kind || 'standard'}`, type: 'button',
      on: { click: () => { if (b.onClick?.() === false) return; finish(typeof b.value === 'function' ? b.value() : (b.value ?? null)); } },
    }, b.label));
    const body = h('div', { class: 'dialog-body' }, content({ close: finish, buttons: footerButtons }));
    const dialog = h('div', { class: `dialog${variant ? ` dialog--${variant}` : ''}`, role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': titleId },
      h('div', { class: 'dialog-head' },
        h('h2', { class: 'dialog-title', id: titleId }, title),
        closable ? h('button', { class: 'btn btn--icon', type: 'button', title: 'Schließen', 'aria-label': 'Schließen', on: { click: () => finish(null) } }, icon('close')) : null),
      body,
      footerButtons.length ? h('div', { class: 'dialog-actions' }, footerButtons) : null);
    const overlay = h('div', { class: `overlay${variant === 'flyout' ? ' overlay--flyout' : ''}`, on: {
      mousedown: e => { if (e.target === overlay) finish(null); },
      keydown: e => {
        if (e.key !== 'Tab') return;
        const list = [...dialog.querySelectorAll(FOCUSABLE)];
        if (!list.length) return;
        const first = list[0];
        const last = list[list.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      },
    } }, dialog);

    dialogs.push(entry);
    layer.append(overlay);
    syncInert();
    const danger = buttons.some(b => b.kind === 'danger');
    const primary = footerButtons.find(b => b.classList.contains('btn--accent'));
    (body.querySelector('input, textarea, select') || (danger ? footerButtons[0] : primary) || dialog.querySelector('button, input, select, textarea'))?.focus();
  });
}

const askConfirm = ({ title, message, confirm, danger = false }) => showDialog({

function askLabel({ title, name = '', color = LABEL_COLORS[0].value, confirm }) {

function validateLabelName(value, current = '') {

  return taken ? 'Diese Kategorie gibt es bereits.' : '';

function validateFolderName(value, current = '') {
  if (!value) return 'Bitte geben Sie einen Namen ein.';
  const names = [...SYSTEM_FOLDERS.map(f => f.name), ...customFolders().map(f => f.name)].map(n => n.toLowerCase());
  if (value.toLowerCase() !== current.toLowerCase() && names.includes(value.toLowerCase())) return 'Diesen Namen gibt es bereits.';

function toast(message, { actionLabel, onAction, timeout } = {}) {

  host.replaceChildren(el);
