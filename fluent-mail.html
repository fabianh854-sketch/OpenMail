        ...offers.map(o => h('div', { class: 'row-card' }, icon('cloud'), h('div', { class: 'row-card-main' }, h('span', { style: 'font-weight:600' }, o.name), h('p', { class: 'set-hint' }, o.desc)),
          btn('Installieren', { kind: 'accent', onClick: () => { state.addons.push({ ...o, id: uid('ad'), on: true, builtin: false }); persist(); logActivity(`Add-on „${o.name}“ installiert`); paint(); toast(`„${o.name}“ installiert`); } }))));
    }
    box.replaceChildren(tabs, tab === 'theme' ? null : h('div', { style: 'margin:var(--sp-3) 0' }, searchBox('Installierte durchsuchen', query, v => { query = v.toLowerCase(); paint(); })), h('div', { style: 'margin-top:var(--sp-3)' }, content));
  };
  paint();
  showDialog({ title: 'Add-ons und Themes', variant: 'wide', closable: true, content: () => box });
}

/* ---- Aktivitäten ---- */
function openActivity() {
  showDialog({
    title: 'Aktivitäten', closable: true,
    content: ({ close }) => {
      const list = state.activities;
      return list.length
        ? h('div', {}, list.map(a => h('div', { class: 'member-row' }, icon('check'), h('span', { style: 'flex:1' }, a.text), h('span', { class: 'chat-time' }, fmtListTime(a.ts)))))
        : h('p', { class: 'empty-hint' }, 'Keine Aktivitäten.');
    },
    buttons: [{ label: 'Liste leeren', onClick: () => { state.activities = []; persist(); } }, { label: 'Schließen', kind: 'accent' }],
  });
}

/* ---- Import & Export ---- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const link = h('a', { href: url, download: name });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const vEsc = s => String(s ?? '').replace(/([,;\\])/g, '\\$1').replace(/\r?\n/g, '\\n');

function exportVcf() {
  const cards = state.people.map(p => {
    const parts = p.name.split(' ');
    const last = parts.length > 1 ? parts.pop() : '';
    return ['BEGIN:VCARD', 'VERSION:3.0', `FN:${vEsc(p.name)}`, `N:${vEsc(last)};${vEsc(parts.join(' '))};;;`,
      p.email && `EMAIL:${vEsc(p.email)}`, p.phone && `TEL:${vEsc(p.phone)}`, p.org && `ORG:${vEsc(p.org)}`, p.title && `TITLE:${vEsc(p.title)}`, p.note && `NOTE:${vEsc(p.note)}`, 'END:VCARD']
      .filter(Boolean).join('\r\n');
  });
  download('adressbuch.vcf', `${cards.join('\r\n')}\r\n`, 'text/vcard');
  logActivity(`${cards.length} Kontakte exportiert`);
  toast(`${cards.length} Kontakte exportiert`);
}

const icsDate = (ts, allDay) => {
  if (allDay) { const d = new Date(ts); return `;VALUE=DATE:${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`; }
  return `:${new Date(ts).toISOString().replace(/[-:]|\.\d{3}/g, '')}`;
};

function exportIcs() {
  const rrule = { daily: 'DAILY', weekly: 'WEEKLY', monthly: 'MONTHLY', yearly: 'YEARLY' };
  const items = state.events.map(e => [
    'BEGIN:VEVENT', `UID:${e.id}@openmail.local`, `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d{3}/g, '')}`,
    `DTSTART${icsDate(e.start, e.allDay)}`, `DTEND${icsDate(e.allDay ? e.end + DAY : e.end, e.allDay)}`, `SUMMARY:${vEsc(e.title)}`,
    e.place && `LOCATION:${vEsc(e.place)}`, e.desc && `DESCRIPTION:${vEsc(e.desc)}`, rrule[e.repeat] && `RRULE:FREQ=${rrule[e.repeat]}`, 'END:VEVENT'].filter(Boolean).join('\r\n'));
  download('kalender.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//OpenMail//DE', ...items, 'END:VCALENDAR'].join('\r\n') + '\r\n', 'text/calendar');
  logActivity(`${items.length} Termine exportiert`);
  toast(`${items.length} Termine exportiert`);
}

function parseVcf(text) {
  const unfolded = text.replace(/\r?\n[ \t]/g, '');
  return unfolded.split(/BEGIN:VCARD/i).slice(1).map(block => {
    const get = tag => block.match(new RegExp(`^${tag}[^:\\n]*:(.*)$`, 'im'))?.[1]?.trim().replace(/\\([,;\\])/g, '$1') ?? '';
    return { name: get('FN'), email: get('EMAIL'), phone: get('TEL'), org: get('ORG').replace(/;/g, ' ') };
  }).filter(c => c.name);
}

function openImportExport() {
  const MAX = 2 * 1048576;
  let file = null;
  const hint = h('p', { class: 'set-hint' }, 'Unterstützt: vCard (.vcf). Weitere Formate (mbox, .ics, CSV) folgen mit dem Backend.');
  const fileLabel = h('span', {}, 'Datei hierher ziehen oder auswählen');
  const input = h('input', { type: 'file', accept: '.vcf,.ics,.csv,.mbox', hidden: true, on: { change: () => { file = input.files[0] ?? null; fileLabel.textContent = file ? `${file.name} (${fmtSize(file.size)})` : 'Datei hierher ziehen oder auswählen'; } } });
  showDialog({
    title: 'Importieren und exportieren', variant: 'wide', closable: true,
    content: () => h('div', {},
      h('h3', { class: 'set-title' }, 'Importieren'),
      h('button', { class: 'drop-zone', type: 'button', style: 'width:100%;background:none', on: { click: () => input.click() } }, icon('download', 'icon-lg'), fileLabel), input, hint,
      ...(isSoon('contacts') && isSoon('calendar') ? [] : [h('h3', { class: 'set-title', style: 'margin-top:var(--sp-5)' }, 'Exportieren')]), // Export: Coming soon
      h('div', { class: 'tile-grid' },
        [['contacts', 'Adressbuch', 'Alle Kontakte als vCard', exportVcf], ['calendar', 'Kalender', 'Alle Termine als .ics', exportIcs]].filter(([key]) => !isSoon(key)).map(([iconName, title, text, run]) =>
          h('button', { class: 'tile', type: 'button', on: { click: run } }, icon(iconName), h('span', { class: 'tile-title' }, title), h('span', { class: 'tile-text' }, text))))),
    buttons: [{ label: 'Schließen' }, {
      label: 'Importieren', kind: 'accent',
      onClick: async () => {
        if (!file) { toast('Bitte zuerst eine Datei auswählen.'); return false; }
        if (file.size > MAX) { toast('Die Datei ist größer als 2 MB.'); return false; }
        if (!/\.vcf$/i.test(file.name)) { toast('Dieses Format wird erst mit dem Backend unterstützt.'); return false; }
        const cards = parseVcf(await file.text()).filter(c => !c.email || !state.people.some(p => p.email.toLowerCase() === c.email.toLowerCase()));
        for (const c of cards) state.people.push({ id: uid('p'), title: '', note: '', fav: false, book: 'personal', ...c });
        syncContacts();
        commit('import_file', { kind: 'vcard', count: cards.length });
        render();
        toast(`${cards.length} ${plural(cards.length, 'Kontakt', 'Kontakte')} importiert`);
        return undefined;
      },
    }],
  });
}

/* ---- Sendeoptionen im Verfassen-Fenster ---- */
function updateComposeOptions() {
  const c = compose;
  if (!c?.optsBox) return;
  const o = c.opts ?? {};
  const badges = [o.encrypt && 'Verschlüsselt', o.sign && 'Signiert', o.receipt && 'Bestätigung', o.priority === 'high' && 'Wichtig', o.priority === 'low' && 'Niedrige Priorität', o.cloud && 'Cloud-Anhang'].filter(Boolean);
  c.optsBox.replaceChildren(...badges.map(b => h('span', { class: 'badge' }, b)));
}

function openComposeOptions(anchor) {
  const c = compose;
  c.opts ??= { receipt: false, encrypt: false, sign: false, priority: 'normal', cloud: false };
  const flip = key => () => { c.opts[key] = !c.opts[key]; updateComposeOptions(); };
  const setPriority = value => () => { c.opts.priority = value; updateComposeOptions(); };
  openMenu({
    anchor, label: 'Sendeoptionen',
    items: [
      { label: 'Verschlüsseln (OpenPGP)', checked: c.opts.encrypt, onSelect: flip('encrypt') },
      { label: 'Digital signieren', checked: c.opts.sign, onSelect: flip('sign') },
      { label: 'Empfangsbestätigung anfordern', checked: c.opts.receipt, onSelect: flip('receipt') },
      { label: 'Große Anhänge über Cloud teilen', checked: c.opts.cloud, onSelect: flip('cloud') },
      { separator: true }, { heading: 'Priorität' },
      { label: 'Niedrig', radio: true, checked: c.opts.priority === 'low', onSelect: setPriority('low') },
      { label: 'Normal', radio: true, checked: c.opts.priority === 'normal', onSelect: setPriority('normal') },
      { label: 'Hoch', radio: true, checked: c.opts.priority === 'high', onSelect: setPriority('high') },
    ],
  });
}

/* ==========================================================================
   16h. GESPEICHERTE SUCHEN (virtuelle Ordner)
   ========================================================================== */
function applySavedSearch(id) {
  const saved = state.savedSearches?.find(s => s.id === id);
  if (!saved) return;
  ui.query = saved.q;
  ui.adv = { ...ui.adv, ...saved.adv, all: true };
  ui.advOpen = false;
  state.view.chip = saved.chip;
  for (const input of document.querySelectorAll('[data-adv]')) {
    const value = ui.adv[input.dataset.adv];
    if (input.type === 'checkbox') input.checked = Boolean(value);
    else input.value = value ?? '';
  }
  state.view.folder = `search:${id}`;
  resetSelection();
  persist();
  render();
}

async function saveCurrentSearch() {
  if (!searchActive() && state.view.chip === 'all') { toast('Gib zuerst eine Suche oder einen Filter ein.'); return; }
  const name = await askText({ title: 'Suche speichern', label: 'Name der Suche', confirm: 'Speichern', validate: value => (value.trim() ? '' : 'Bitte einen Namen eingeben.') });
  if (!name) return;
  const saved = { id: uid('s'), name, q: ui.query, chip: state.view.chip, adv: { ...ui.adv } };
  (state.savedSearches ??= []).push(saved);
  commit('save_search', { search: saved });
  applySavedSearch(saved.id);
  toast(`Suche „${name}“ gespeichert`);
}

async function deleteSavedSearch(id) {
  const saved = state.savedSearches.find(s => s.id === id);
  if (!saved || !await askConfirm({ title: `Suche „${saved.name}“ löschen?`, message: 'Nur die gespeicherte Suche wird entfernt, keine Nachrichten.', confirm: 'Löschen', danger: true })) return;
  state.savedSearches = state.savedSearches.filter(s => s !== saved);
  commit('delete_search', { id });
  if (state.view.folder === `search:${id}`) { clearAdv(); ui.query = ''; state.view.chip = 'all'; setFolder('inbox'); } else render();
  toast('Gespeicherte Suche gelöscht');
}

/* ==========================================================================
   16. START
   ========================================================================== */
for (const el of document.querySelectorAll('[data-icon]')) el.prepend(icon(el.dataset.icon, el.dataset.iconClass));
/** Erster Aufbau der Oberfläche; wirft er trotz Prüfung, einmalig auf Startdaten zurückfallen (keine Endlosschleife). */
function startUi() {
  ensureExtras();
  applyTheme();
  if (!viewExists(state.view.folder)) state.view.folder = 'inbox';
  render();
}
try {
  startUi();
} catch (err) {
  console.warn('Start mit gespeichertem Zustand fehlgeschlagen, verwende Startdaten:', err);
  // Den beim Laden gelesenen Originalstand sichern (der Speicher wurde inzwischen evtl. überschrieben).
  const backupKey = loadedBackedUp ? null : backupDefekt(loadedRaw);
  const hint = backupKey ? ` Eine Sicherung liegt unter „${backupKey}“.` : '';
  state = seedState();
  persist();
  loadNotice = `Gespeicherte Daten waren beschädigt und ließen sich nicht anzeigen; sie wurden durch Startdaten ersetzt.${hint}`;
  startUi();
}
if (loadNotice) toast(loadNotice, { timeout: 12000 });
</script>
